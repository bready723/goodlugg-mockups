<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goodlugg — My Page 쿠폰함 (Coupon Wallet)</title>
    <link
      rel="stylesheet"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <style>
      :root {
        --purple: #512a72;
        --purple-deep: #3c1f55;
        --lime: #c7c22e;
        --text: #333333;
        --text-2: #666666;
        --text-3: #999999;
        --border: #e0e0e0;
        --bg: #f5f5f5;
        --white: #ffffff;
        --ok: #1a7f4b;
        --warn: #c0392b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Pretendard",
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        padding: 24px 12px 64px;
      }

      .phone {
        max-width: 420px;
        margin: 0 auto;
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }
      /* 폰에서는 실제 사이트처럼 화면 전체를 쓴다 */
      @media (max-width: 480px) {
        body {
          padding: 0;
          background: var(--white);
        }
        .phone {
          border: none;
          border-radius: 0;
        }
      }

      /* ---------- Nav ---------- */
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border-bottom: 1px solid #f0f0f0;
      }
      .logo {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .logo .g {
        color: var(--purple);
      }
      .logo .l {
        color: var(--lime);
      }
      .nav-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 13px;
        color: var(--text-2);
        font-family: inherit;
        min-height: 44px;
        padding: 0 4px;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .nav-icons {
        display: flex;
        gap: 14px;
        align-items: center;
      }

      /* ---------- My Page tabs ---------- */
      .mypage-tabs {
        display: flex;
        overflow-x: auto;
        border-bottom: 1px solid var(--border);
        scrollbar-width: none;
      }
      .mypage-tabs::-webkit-scrollbar {
        display: none;
      }
      .mypage-tabs a {
        flex: 0 0 auto;
        padding: 13px 14px;
        font-size: 14px;
        color: var(--text-2);
        text-decoration: none;
        white-space: nowrap;
        border-bottom: 2px solid transparent;
      }
      .mypage-tabs a.active {
        color: var(--purple);
        font-weight: 700;
        border-bottom-color: var(--purple);
      }

      /* ---------- Wallet head ---------- */
      .wallet-head {
        padding: 16px 16px 0;
      }
      .wallet-head h1 {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.02em;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .wallet-head h1 .en:empty {
        display: none;
      }
      .wallet-head h1 .en {
        font-size: 12px;
        font-weight: 400;
        color: var(--text-3);
        letter-spacing: 0;
      }
      .wallet-head .sub {
        font-size: 13px;
        color: var(--text-2);
        margin-top: 4px;
      }

      /* ---------- Register box ---------- */
      .register {
        margin: 12px 16px 16px;
        padding: 12px;
        background: var(--white);
        border: 1px solid #ddd3e8;
        border-radius: 8px;
      }
      .register label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .register-row {
        display: flex;
        gap: 8px;
      }
      .register input {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        padding: 11px 12px;
        font-size: 14px;
        font-family: inherit;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--white);
      }
      .register input:focus {
        outline: 2px solid var(--purple);
        outline-offset: -1px;
      }
      .register button {
        flex: 0 0 auto;
        min-height: 44px;
        padding: 11px 20px;
        background: var(--purple);
        color: var(--white);
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
      }
      .register button:hover {
        background: var(--purple-deep);
      }
      .register .hint {
        font-size: 12px;
        color: var(--text-3);
        margin-top: 6px;
      }
      .msg {
        margin-top: 10px;
        padding: 9px 11px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
      }
      .msg.ok {
        background: #eaf6ef;
        color: var(--ok);
      }
      .msg.err {
        background: #fdecea;
        color: var(--warn);
      }

      /* 등록 영역 ↔ 내 쿠폰 목록 구분: 위쪽 전체를 다른 배경색으로 칠하고 짙은 선으로 끊는다.
         쿠폰 ↔ 할인코드 구분(연한 점선)과 모양을 달리해 두 단계를 구별한다. */
      .top-area {
        background: #f3f0f7;
        border-bottom: 2px solid #333333;
        padding-bottom: 2px;
      }

      /* ---------- Filter tabs ---------- */
      .filters {
        display: flex;
        gap: 8px;
        padding: 14px 16px 12px;
      }
      .filters button {
        min-height: 34px;
        padding: 6px 14px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--white);
        color: var(--text-2);
        font-size: 13px;
        font-family: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      .filters button.active {
        background: var(--purple);
        border-color: var(--purple);
        color: var(--white);
        font-weight: 700;
      }

      /* ---------- Coupon cards ---------- */
      .list {
        padding: 0 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .card {
        border: 1px solid #bfaad3;
        border-radius: 8px;
        padding: 12px 14px;
        position: relative;
        background: var(--white);
      }
      .card.spent {
        border-color: var(--border);
        background: #fbfbfb;
      }
      .card.spent .card-name,
      .card.spent .amount,
      .card.spent .row dd {
        color: var(--text-3);
      }
      .card.spent .amount {
        color: var(--text-2);
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
        margin-bottom: 2px;
      }
      .card-top > div:first-child {
        flex: 1;
        min-width: 0;
      }
      .card-name {
        font-size: 12.5px;
        font-weight: 600;
        line-height: 1.35;
        letter-spacing: -0.01em;
      }
      /* ---------- Groups (결제화면의 두 입력칸과 1:1로 맞춘 구획) ---------- */
      .group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      /* 위=쿠폰 / 아래=할인코드. 두꺼운 가로 띠로 확실히 끊는다.
         .list 의 좌우 여백(16px)을 상쇄해 화면 끝까지 닿게 함. */
      .group + .group {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px dashed #b9a3cf;
        margin-left: -16px;
        margin-right: -16px;
        padding-left: 16px;
        padding-right: 16px;
      }
      .group-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .group-title {
        font-size: 14px;
        font-weight: 800;
        color: var(--purple);
        letter-spacing: -0.01em;
      }
      .group-count {
        font-size: 12px;
        font-weight: 700;
        color: var(--white);
        background: var(--purple);
        border-radius: 999px;
        padding: 1px 8px;
      }
      .group-where {
        font-size: 12px;
        color: var(--text-2);
        margin-top: -6px;
      }
      .group-where strong {
        color: var(--warn);
        font-weight: 700;
      }
      .group-empty {
        font-size: 13px;
        color: var(--text-3);
        padding: 14px 0 4px;
      }

      .badge {
        flex: 0 0 auto;
        font-size: 10.5px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 4px;
        white-space: nowrap;
      }
      .badge.avail {
        background: #eef3ee;
        color: var(--ok);
      }
      .badge.used {
        background: #eeeeee;
        color: var(--text-2);
      }
      .badge.exp {
        background: #f6eceb;
        color: var(--warn);
      }

      .amount {
        font-size: 18px;
        font-weight: 800;
        color: var(--purple);
        letter-spacing: -0.02em;
        line-height: 1.3;
        margin-bottom: 4px;
      }
      .amount .cap {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-2);
        margin-left: 6px;
      }

      .rows {
        margin: 0;
      }
      .row {
        display: flex;
        gap: 6px;
        font-size: 12.5px;
        line-height: 1.4;
        padding: 1px 0;
      }
      .row dt {
        flex: 0 0 52px;
        color: var(--text-3);
      }
      .row dd {
        flex: 1;
        color: var(--text);
      }

      .codeline {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
      }
      .codeval {
        flex: 1;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.06em;
        background: var(--bg);
        line-height: 24px;
        padding: 6px 10px;
        border-radius: 5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .copy {
        flex: 0 0 auto;
        height: 36px;
        padding: 0 14px;
        border: 1px solid var(--purple);
        background: var(--white);
        color: var(--purple);
        border-radius: 5px;
        font-size: 13px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
      }
      .copy:hover {
        background: var(--purple);
        color: var(--white);
      }
      .copy.done {
        background: var(--purple);
        color: var(--white);
      }

      .expiring {
        display: inline-block;
        margin-left: 6px;
        font-size: 11px;
        font-weight: 700;
        color: var(--warn);
      }

      /* 쿠폰함에서 빼기: 복사 버튼 옆 회색 휴지통 */
      .del {
        flex: 0 0 auto;
        width: 36px;
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 5px;
        background: #f2f2f2;
        color: var(--text-3);
        cursor: pointer;
      }
      .del svg {
        width: 18px;
        height: 18px;
      }
      .del:hover {
        background: #fdecea;
        color: var(--warn);
      }
      .card-top .del {
        width: 28px;
        height: 28px;
      }
      .card-top .del svg {
        width: 15px;
        height: 15px;
      }

      /* ---------- Empty ---------- */
      .empty {
        padding: 48px 20px;
        text-align: center;
        color: var(--text-3);
        font-size: 14px;
      }
      .empty strong {
        display: block;
        color: var(--text-2);
        font-size: 15px;
        margin-bottom: 6px;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="nav">
        <button class="nav-btn" id="langBtn" type="button">
          🌐 <span id="langLabel">한국어</span> ▾
        </button>
        <div class="logo">
          <span class="g">Good</span><span class="l">lugg</span>
        </div>
        <div class="nav-icons">
          <button class="nav-btn" type="button">☰</button>
        </div>
      </div>

      <nav class="mypage-tabs">
        <a href="#" data-i18n="tab.bookings">예약내역</a>
        <a href="#" data-i18n="tab.rewards">포인트</a>
        <a href="#" class="active" data-i18n="tab.coupons">쿠폰함</a>
        <a href="#" data-i18n="tab.referral">친구초대</a>
        <a href="#" data-i18n="tab.profile">회원정보</a>
      </nav>

      <div class="top-area">
        <div class="wallet-head">
          <h1>
            <span data-i18n="wallet.title">내 쿠폰함</span>
            <span class="en" data-i18n="wallet.titleEn">Coupon Wallet</span>
          </h1>
          <p class="sub" data-i18n="wallet.sub">
            쿠폰번호나 할인코드를 여기에 저장해 두세요.
          </p>
        </div>

        <div class="register">
          <label for="codeInput" data-i18n="reg.label"
            >쿠폰번호·할인코드 붙여넣기</label
          >
          <div class="register-row">
            <input
              id="codeInput"
              type="text"
              autocomplete="off"
              spellcheck="false"
              data-i18n-ph="reg.ph"
              placeholder="예: A1B2C3D4E5 또는 WelcomeGoodlugg10"
            />
            <button id="regBtn" type="button" data-i18n="reg.btn">저장</button>
          </div>
          <p class="hint" data-i18n="reg.hint">대소문자는 구분하지 않아요.</p>
          <div id="regMsg"></div>
        </div>
      </div>

      <div class="filters">
        <button type="button" class="active" data-filter="avail">
          <span data-i18n="filter.avail">사용 가능</span>
          <span id="cntAvail">3</span>
        </button>
        <button type="button" data-filter="done">
          <span data-i18n="filter.done">사용완료·만료</span>
          <span id="cntDone">2</span>
        </button>
      </div>

      <div class="list" id="list"></div>
    </div>

    <script>
      var I18N = {
        ko: {
          "tab.bookings": "예약내역",
          "tab.rewards": "포인트",
          "tab.coupons": "쿠폰함",
          "tab.referral": "친구초대",
          "tab.profile": "회원정보",
          "wallet.title": "내 쿠폰함",
          "wallet.titleEn": "Coupon Wallet",
          "wallet.sub": "쿠폰번호나 할인코드를 여기에 저장해 두세요.",
          "reg.label": "쿠폰번호·할인코드 붙여넣기",
          "reg.ph": "예: A1B2C3D4E5",
          "reg.btn": "저장",
          "reg.hint": "대소문자는 구분하지 않아요.",
          "filter.avail": "사용 가능",
          "filter.done": "사용완료·만료",

          "lbl.services": "서비스",
          "lbl.service_window": "배송일 조건",

          "badge.avail": "사용 가능",
          "badge.used": "사용완료",
          "badge.exp": "기간만료",
          "group.coupon": "쿠폰",
          "group.code": "할인코드/파트너코드",
          "group.coupon.where": "결제할 때 [쿠폰] 칸에 입력하세요.",
          "group.code.where":
            "로그인 후, 결제할 때 [할인코드] 칸에 입력하세요.",
          "group.empty": "해당 쿠폰 없음",

          "kind.code": "할인코드",
          copy: "복사",
          copied: "복사됨",
          del: "쿠폰함에서 빼기",
          expiring: "{n}일 남음",
          "empty.avail": "사용 가능한 쿠폰이 없습니다.",
          "empty.done": "사용했거나 기간이 지난 쿠폰이 없습니다.",
          "empty.sub": "받으신 쿠폰번호를 위에서 등록해 보세요.",
          "err.dup": "이미 쿠폰함에 있습니다.",
          "err.used": "이미 사용된 쿠폰입니다.",
          "err.exp": "사용기한이 지났습니다.",
          "err.none": "없는 코드입니다. 다시 확인해 주세요.",
          "err.blank": "쿠폰번호 또는 할인코드를 입력해 주세요.",
          "ok.added": "쿠폰함에 저장했습니다.",
          "ok.removed": "쿠폰함에서 뺐습니다.",
          cap: "최대 {n}",
        },
        en: {
          "tab.bookings": "Bookings",
          "tab.rewards": "Rewards",
          "tab.coupons": "Coupons",
          "tab.referral": "Referral",
          "tab.profile": "Personal Info",
          "wallet.title": "Coupon Wallet",
          "wallet.titleEn": "",
          "wallet.sub": "Save any coupon or discount code here.",
          "reg.label": "Paste a coupon or discount code",
          "reg.ph": "e.g. A1B2C3D4E5",
          "reg.btn": "Save",
          "reg.hint": "Not case-sensitive.",
          "filter.avail": "Available",

          "badge.used": "Used",
          "badge.exp": "Expired",
          "group.coupon": "Coupon",
          "group.code": "Discount / Partner code",
          "group.coupon.where": "Enter it in the [Coupon] field at checkout.",

            "Log in first, then enter it in the [Discount code] field at checkout.",
          "group.empty": "None in this section",
          "kind.coupon": "Coupon",
          "kind.code": "Discount code",
          copy: "Copy",

          del: "Remove from wallet",
          expiring: "{n} days left",
          "empty.avail": "No available coupons.",
          "empty.done": "No used or expired coupons.",
          "empty.sub": "Add a coupon number above to get started.",
          "err.dup": "Already in your wallet.",
          "err.used": "This coupon has already been used.",
          "err.exp": "This coupon has expired.",
          "err.none": "Code not found. Please check and try again.",
          "err.blank": "Please enter a coupon number or discount code.",
          "ok.added": "Saved to your wallet.",
          "ok.removed": "Removed from your wallet.",
          cap: "max {n}",
        },
      };

      var lang = "ko";
      function t(k) {
        var v = I18N[lang] && I18N[lang][k];
        return v === undefined ? k : v;
      }

      /* source: 'wallet' = 고객이 직접 등록 (빼면 행 삭제) · 'issued' = 계정으로 이미 발급됨 (빼면 숨김 처리, 쿠폰은 유효) */
      /* 표본 데이터. 쿠폰 이름과 조건(할인·최대할인·유효기간·적용 서비스)은
         2026-09-15 CS Live Reference 시트 기준 실제 값.
         쿠폰번호만 가짜 - 이 저장소는 공개이므로 실제 번호를 넣지 않는다.
         할인코드는 원래 공개용이라 실제 코드 그대로 사용. */
      var DATA = [
        {
          id: 1,
          kind: "coupon",
          state: "avail",
          source: "wallet",
          name: { ko: "ISIC제휴쿠폰", en: "ISIC partner coupon" },
          amount: { ko: "10% 할인", en: "10% off" },
          cap: { ko: "50,000원", en: "\u20a950,000" },
          expire: "2027.03.31",
          services: {
            ko: "호텔-공항 짐배송 · 실시간 짐보관 · 도시간 짐배송",
            en: "Hotel-Airport · Realtime Storage · Inter-City",
          },
          code: "A1B2C3D4E5",
        },
        {
          id: 2,

          services: { ko: "전 서비스", en: "All services" },
          limit: { ko: "3회까지", en: "up to 3 times" },
          code: "VisaGlobal10",

          name: { ko: "하나은행 SDD 제휴", en: "Hana Bank SDD partnership" },
          amount: { ko: "10% 할인", en: "10% off" },
          cap: null,
          expire: "2026.12.31",
          services: {
            ko: "호텔-공항 짐배송 · 도시간 짐배송",
            en: "Hotel-Airport · Inter-City",
          },
          code: "N4V6B8H1J3",
          used: "2026.08.02",
          booking: "GL26080200123",
        },
        {
          id: 7,
          kind: "coupon",
          state: "exp",
          source: "wallet",
          name: {
            ko: "KD 이용자 5천원 할인쿠폰",
            en: "Korea Delivery \u20a95,000 coupon",
          },
          amount: { ko: "5,000원 할인", en: "\u20a95,000 off" },
          cap: null,
          expire: "2026.08.31",
          services: { ko: "국내 짐배송", en: "Korea Delivery" },
          code: "P2L9D6F3G8",
        },
      ];

      var filter = "avail";

      /* Days until expiry, counted in KST (the service timezone), not the viewer's. */
      function daysLeft(dateStr) {
        var p = dateStr.split(".");
        if (p.length !== 3) {
          return null;
        }
        var expiryKst = Date.UTC(+p[0], +p[1] - 1, +p[2]) - 9 * 3600 * 1000;
        var nowKst = Date.now();
        var d = Math.ceil((expiryKst - nowKst) / 86400000);
        return d < 0 ? null : d;
      }

      var TRASH_SVG =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[c];
        });
      }

      function cardHtml(c) {
        var badgeCls =
          c.state === "avail" ? "avail" : c.state === "used" ? "used" : "exp";
        var badgeTxt =
          c.state === "avail"
            ? t("badge.avail")
            : c.state === "used"
              ? t("badge.used")
              : t("badge.exp");
        var capHtml = c.cap
          ? '<span class="cap">' +
            esc(t("cap").replace("{n}", c.cap[lang])) +
            "</span>"
          : "";

        var warn = "";
        if (c.state === "avail") {
          var left = daysLeft(c.expire);
          if (left !== null && left <= 14) {
            warn =
              '<span class="expiring">' +
              esc(t("expiring").replace("{n}", left)) +
              "</span>";
          }
        }

        var rows = "";
        rows +=
          '<div class="row"><dt>' +
          esc(t("lbl.expire")) +
          "</dt><dd>~ " +
          esc(c.expire) +
          " (KST)" +
          warn +
          "</dd></div>";
        rows +=
          '<div class="row"><dt>' +
          esc(t("lbl.services")) +
          "</dt><dd>" +
          esc(c.services[lang]) +
          "</dd></div>";
        if (c.limit) {
          rows +=
            '<div class="row"><dt>' +
            esc(t("lbl.limit")) +
            "</dt><dd>" +
            esc(c.limit[lang]) +
            "</dd></div>";
        }
        if (c.window) {
          rows +=
            '<div class="row"><dt>' +
            esc(t("lbl.service_window")) +
            "</dt><dd>" +
            esc(c.window[lang]) +
            "</dd></div>";
        }
        if (c.used) {
          rows +=
            '<div class="row"><dt>' +
            esc(t("lbl.used")) +
            "</dt><dd>" +
            esc(c.used) +
            "</dd></div>";
          rows +=
            '<div class="row"><dt>' +
            esc(t("lbl.booking")) +
            "</dt><dd>" +
            esc(c.booking) +
            "</dd></div>";
        }

        /* 모든 카드에 휴지통. 계정 발급분(issued)은 목록에서 숨김 처리일 뿐 쿠폰 자체는 그대로 */
        var delBtn =
          '<button class="del" type="button" data-del="' +
          c.id +
          '" aria-label="' +
          esc(t("del")) +
          '" title="' +
          esc(t("del")) +
          '">' +
          TRASH_SVG +
          "</button>";

        var codeBlock = "";
        if (c.state === "avail") {
          codeBlock =
            '<div class="codeline">' +
            '<span class="codeval">' +
            esc(c.code) +
            "</span>" +
            '<button class="copy" type="button" data-copy="' +
            esc(c.code) +
            '">' +
            esc(t("copy")) +
            "</button>" +
            delBtn +
            "</div>";
        }

        return (
          "" +
          '<div class="card' +
          (c.state === "avail" ? "" : " spent") +
          '">' +
          '<div class="card-top">' +
          "<div>" +
          '<div class="card-name">' +
          esc(c.name[lang]) +
          "</div>" +
          "</div>" +
          '<span class="badge ' +
          badgeCls +
          '">' +
          esc(badgeTxt) +
          "</span>" +
          (c.state === "avail" ? "" : delBtn) +
          "</div>" +
          '<div class="amount">' +
          esc(c.amount[lang]) +
          capHtml +
          "</div>" +
          '<dl class="rows">' +
          rows +
          "</dl>" +
          codeBlock +
          "</div>"
        );
      }

      function render() {
        var avail = DATA.filter(function (c) {
          return c.state === "avail";
        });
        var done = DATA.filter(function (c) {
          return c.state !== "avail";
        });
        document.getElementById("cntAvail").textContent = avail.length;
        document.getElementById("cntDone").textContent = done.length;

        var items = filter === "avail" ? avail : done;
        var list = document.getElementById("list");

        if (!items.length) {
          list.innerHTML =
            '<div class="empty"><strong>' +
            esc(filter === "avail" ? t("empty.avail") : t("empty.done")) +
            "</strong>" +
            esc(t("empty.sub")) +
            "</div>";
          return;
        }

        /* 결제화면이 "쿠폰" / "할인코드/파트너코드" 두 칸으로 나뉘어 있으므로
           쿠폰함도 같은 이름, 같은 순서로 나눠 보여준다. */
        function group(kind, titleKey, whereKey) {
          var rows = items.filter(function (c) {
            return c.kind === kind;
          });
          return (
            '<div class="group">' +
            '<div class="group-head">' +
            '<h3 class="group-title">' +
            esc(t(titleKey)) +
            "</h3>" +
            '<span class="group-count">' +
            rows.length +
            "</span>" +
            "</div>" +
            '<p class="group-where">' +
            /* [ ] 안의 결제화면 칸 이름은 굵은 빨강 */
            esc(t(whereKey)).replace(/\[(.+?)\]/g, "<strong>$1</strong>") +
            "</p>" +
            (rows.length
              ? rows.map(cardHtml).join("")
              : '<p class="group-empty">' + esc(t("group.empty")) + "</p>") +
            "</div>"
          );
        }

        list.innerHTML =
          group("coupon", "group.coupon", "group.coupon.where") +
          group("code", "group.code", "group.code.where");
      }

      function applyLang() {
        document.documentElement.lang = lang;
        document.getElementById("langLabel").textContent =
          lang === "ko" ? "한국어" : "English";
        var nodes = document.querySelectorAll("[data-i18n]");
        for (var i = 0; i < nodes.length; i++) {
          nodes[i].textContent = t(nodes[i].getAttribute("data-i18n"));
        }
        var phs = document.querySelectorAll("[data-i18n-ph]");
        for (var j = 0; j < phs.length; j++) {
          phs[j].setAttribute(
            "placeholder",
            t(phs[j].getAttribute("data-i18n-ph")),
          );
        }
        render();
      }

      function showMsg(cls, key) {
        document.getElementById("regMsg").innerHTML =
          '<div class="msg ' + cls + '">' + esc(t(key)) + "</div>";
      }

      document.getElementById("langBtn").addEventListener("click", function () {
        lang = lang === "ko" ? "en" : "ko";
        document.getElementById("regMsg").innerHTML = "";
        applyLang();
      });

      var filterBtns = document.querySelectorAll(".filters button");
      for (var i = 0; i < filterBtns.length; i++) {
        filterBtns[i].addEventListener("click", function () {
          for (var k = 0; k < filterBtns.length; k++) {
            filterBtns[k].classList.remove("active");
          }
          this.classList.add("active");
          filter = this.getAttribute("data-filter");
          render();
        });
      }

      document.getElementById("list").addEventListener("click", function (e) {
        var delBtn = e.target.closest(".del");
        if (delBtn) {
          var id = Number(delBtn.getAttribute("data-del"));
          DATA = DATA.filter(function (c) {
            return c.id !== id;
          });
          showMsg("ok", "ok.removed");
          render();
          return;
        }

        var btn = e.target.closest(".copy");
        if (!btn) {
          return;
        }
        var val = btn.getAttribute("data-copy");
        if (navigator.clipboard) {
          navigator.clipboard.writeText(val);
        }
        btn.textContent = t("copied");
        btn.classList.add("done");
        setTimeout(function () {
          btn.textContent = t("copy");
          btn.classList.remove("done");
        }, 1400);
      });

      /* Demo only: fake lookup so reviewers can see each message state. */
      document.getElementById("regBtn").addEventListener("click", function () {
        var raw = document.getElementById("codeInput").value.trim();
        if (!raw) {
          showMsg("err", "err.blank");
          return;
        }
        var v = raw.toUpperCase();

        var exists = DATA.some(function (c) {
          return c.code.toUpperCase() === v;
        });
        if (exists) {
          showMsg("err", "err.dup");
          return;
        }
        if (v === "USED") {
          showMsg("err", "err.used");
          return;
        }
        if (v === "EXPIRED") {
          showMsg("err", "err.exp");
          return;
        }
        if (v !== "DEMO") {
          showMsg("err", "err.none");
          return;
        }

        DATA.unshift({
          id: Date.now(),
          kind: "coupon",
          state: "avail",
          source: "wallet",
          name: { ko: "신규 등록 쿠폰", en: "Newly added coupon" },
          amount: { ko: "₩5,000 할인", en: "₩5,000 off" },
          cap: null,
          expire: "2026.12.31",
          services: { ko: "전 서비스", en: "All services" },
          code: "DEMO",
        });
        document.getElementById("codeInput").value = "";
        showMsg("ok", "ok.added");
        filter = "avail";
        for (var k = 0; k < filterBtns.length; k++) {
          filterBtns[k].classList.remove("active");
        }
        filterBtns[0].classList.add("active");
        render();
      });

      applyLang();
    </script>
  </body>
