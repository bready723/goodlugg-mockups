<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goodlugg — My Page 쿠폰함 (Coupon Wallet)</title>
    <link
      rel="stylesheet"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <style>
      :root {
        --purple: #512a72;
        --purple-deep: #3c1f55;
        --lime: #c7c22e;
        --text: #333333;
        --text-2: #666666;
        --text-3: #999999;
        --border: #e0e0e0;
        --bg: #f5f5f5;
        --white: #ffffff;
        --ok: #1a7f4b;
        --warn: #c0392b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Pretendard",
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        padding: 24px 12px 64px;
      }

      .phone {
        max-width: 420px;
        margin: 0 auto;
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }
      /* 폰에서는 실제 사이트처럼 화면 전체를 쓴다 */
      .preview-bar {
        max-width: 420px;
        margin: 0 auto 10px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        background: #2b2b2b;
        border-radius: 8px;
        font-size: 12px;
        color: #bbbbbb;
      }
      .preview-bar span {
        margin-right: auto;
        padding-left: 4px;
      }
      .preview-bar button {
        min-height: 32px;
        padding: 0 12px;
        border: 1px solid #555555;
        border-radius: 999px;
        background: none;
        color: #dddddd;
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .preview-bar button.on {
        background: var(--lime);
        border-color: var(--lime);
        color: #1a1a1a;
        font-weight: 700;
      }
      @media (max-width: 480px) {
        body {
          padding: 0;
          background: var(--white);
        }
        .preview-bar {
          margin: 0;
          border-radius: 0;
        }
        .phone {
          border: none;
          border-radius: 0;
        }
      }

      /* ---------- Nav ---------- */
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border-bottom: 1px solid #f0f0f0;
      }
      .logo {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .logo .g {
        color: var(--purple);
      }
      .logo .l {
        color: var(--lime);
      }
      .nav-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 13px;
        color: var(--text-2);
        font-family: inherit;
        min-height: 44px;
        padding: 0 4px;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .nav-icons {
        display: flex;
        gap: 14px;
        align-items: center;
      }

      /* ---------- My Page tabs ---------- */
      .mypage-tabs {
        display: flex;
        overflow-x: auto;
        border-bottom: 1px solid var(--border);
        scrollbar-width: none;
      }
      .mypage-tabs::-webkit-scrollbar {
        display: none;
      }
      .mypage-tabs a {
        flex: 0 0 auto;
        padding: 13px 14px;
        font-size: 14px;
        color: var(--text-2);
        text-decoration: none;
        white-space: nowrap;
        border-bottom: 2px solid transparent;
      }
      .mypage-tabs a.active {
        color: var(--purple);
        font-weight: 700;
        border-bottom-color: var(--purple);
      }

      /* ---------- Wallet head ---------- */
      .wallet-head {
        padding: 16px 16px 0;
      }
      .wallet-head h1 {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.02em;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .wallet-head h1 .en:empty {
        display: none;
      }
      .wallet-head h1 .en {
        font-size: 12px;
        font-weight: 400;
        color: var(--text-3);
        letter-spacing: 0;
      }
      .wallet-head .sub {
        font-size: 13px;
        color: var(--text-2);
        margin-top: 4px;
      }

      /* ---------- Register box ---------- */
      .register {
        margin: 12px 16px 16px;
        padding: 12px;
        background: var(--white);
        border: 1px solid #ddd3e8;
        border-radius: 8px;
      }
      .register label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .register-row {
        display: flex;
        gap: 8px;
      }
      .register input {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        padding: 11px 12px;
        font-size: 14px;
        font-family: inherit;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--white);
      }
      .register input:focus {
        outline: 2px solid var(--purple);
        outline-offset: -1px;
      }
      .register button {
        flex: 0 0 auto;
        min-height: 44px;
        padding: 11px 20px;
        background: var(--purple);
        color: var(--white);
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
      }
      .register button:hover {
        background: var(--purple-deep);
      }
      .register .hint {
        font-size: 12px;
        color: var(--text-3);
        margin-top: 6px;
      }
      .msg {
        margin-top: 10px;
        padding: 9px 11px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
      }
      .msg.ok {
        background: #eaf6ef;
        color: var(--ok);
      }
      .msg.err {
        background: #fdecea;
        color: var(--warn);
      }

      /* 등록 영역 ↔ 내 쿠폰 목록 구분: 위쪽 전체를 다른 배경색으로 칠하고 짙은 선으로 끊는다.
         쿠폰 ↔ 할인코드 구분(연한 점선)과 모양을 달리해 두 단계를 구별한다. */
      .top-area {
        background: #f3f0f7;
        border-bottom: 2px solid #333333;
        padding-bottom: 2px;
      }

      /* ---------- Filter tabs ---------- */
      .filters {
        display: flex;
        gap: 8px;
        padding: 14px 16px 12px;
      }
      .filters button {
        min-height: 34px;
        padding: 6px 14px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--white);
        color: var(--text-2);
        font-size: 13px;
        font-family: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      .filters button.active {
        background: var(--purple);
        border-color: var(--purple);
        color: var(--white);
        font-weight: 700;
      }

      /* ---------- Coupon cards ---------- */
      .list {
        padding: 0 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .card {
        border: 1px solid #bfaad3;
        border-radius: 8px;
        padding: 12px 14px;
        position: relative;
        background: var(--white);
      }
      .card.just-added {
        box-shadow: 0 0 0 3px rgba(81, 42, 114, 0.35);
        transition: box-shadow 0.3s;
      }
      .card.spent {
        border-color: var(--border);
        background: #fbfbfb;
      }
      .card.spent .card-name,
      .card.spent .amount,
      .card.spent .row dd {
        color: var(--text-3);
      }
      .card.spent .amount {
        color: var(--text-2);
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
        margin-bottom: 2px;
      }
      .card-top > div:first-child {
        flex: 1;
        min-width: 0;
      }
      .card-name {
        font-size: 12.5px;
        font-weight: 600;
        line-height: 1.35;
        letter-spacing: -0.01em;
      }
      /* ---------- Groups (결제화면의 두 입력칸과 1:1로 맞춘 구획) ---------- */
      .group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      /* 위=쿠폰 / 아래=할인코드. 두꺼운 가로 띠로 확실히 끊는다.
         .list 의 좌우 여백(16px)을 상쇄해 화면 끝까지 닿게 함. */
      .group + .group {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px dashed #b9a3cf;
        margin-left: -16px;
        margin-right: -16px;
        padding-left: 16px;
        padding-right: 16px;
      }
      .group-head {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .group-title {
        font-size: 20px; /* 페이지 제목(Coupon Wallet)과 같은 크기 */
        line-height: 1.3;
        font-weight: 800;
        color: var(--purple);
        letter-spacing: -0.01em;
      }
      .group-count {
        font-size: 13px;
        font-weight: 700;
        color: var(--white);
        background: var(--purple);
        border-radius: 999px;
        padding: 1px 9px;
      }
      .group-where {
        font-size: 12px;
        color: var(--text-2);
        margin-top: -5px;
      }
      .group-where strong {
        color: var(--warn);
        font-weight: 700;
      }
      /* 사용완료·만료 탭에서는 칸 이름 강조 없이 같은 회색 */
      .list.is-done .group-where strong {
        color: inherit;
        font-weight: inherit;
      }
      .group-empty {
        padding: 22px 8px 18px;
        text-align: center;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-2);
      }
      .group-empty .empty-icon {
        display: block;
        width: 52px;
        height: 52px;
        margin: 0 auto 6px;
        color: #bfaad3;
      }
      .group-empty .coupon-icon {
        width: 66px;
        height: 44px;
      }
      .group-empty .code-icon {
        width: 80px;
        height: 45px;
      }

      .badge {
        flex: 0 0 auto;
        font-size: 10.5px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 4px;
        white-space: nowrap;
      }
      .badge.avail {
        background: #eef3ee;
        color: var(--ok);
      }
      .badge.used {
        background: #eeeeee;
        color: var(--text-2);
      }
      .badge.exp {
        background: #f6eceb;
        color: var(--warn);
      }

      .amount {
        font-size: 18px;
        font-weight: 800;
        color: var(--purple);
        letter-spacing: -0.02em;
        line-height: 1.3;
        margin-bottom: 4px;
      }
      .amount .cap {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-2);
        margin-left: 6px;
      }

      .rows {
        margin: 0;
      }
      .row {
        display: flex;
        gap: 6px;
        font-size: 12.5px;
        line-height: 1.4;
        padding: 1px 0;
      }
      .row dt {
        flex: 0 0 52px;
        color: var(--text-3);
      }
      .row dd {
        flex: 1;
        color: var(--text);
      }

      .codeline {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
      }
      .codeval {
        flex: 1;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.06em;
        background: var(--bg);
        line-height: 24px;
        padding: 6px 10px;
        border-radius: 5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .copy {
        flex: 0 0 auto;
        height: 36px;
        padding: 0 14px;
        border: 1px solid var(--purple);
        background: var(--white);
        color: var(--purple);
        border-radius: 5px;
        font-size: 13px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
      }
      .copy:hover {
        background: var(--purple);
        color: var(--white);
      }
      .copy.done {
        background: var(--purple);
        color: var(--white);
      }

      .expiring {
        display: inline-block;
        margin-left: 6px;
        font-size: 11px;
        font-weight: 700;
        color: #e8710a; /* 만료 임박: 주황 (빨강=칸 이름 강조와 구분) */
      }

      /* 쿠폰함에서 빼기: 복사 버튼 옆 회색 휴지통 */
      .del {
        flex: 0 0 auto;
        width: 36px;
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 5px;
        background: #f2f2f2;
        color: var(--text-3);
        cursor: pointer;
      }
      .del svg {
        width: 18px;
        height: 18px;
      }
      .del:hover {
        background: #fdecea;
        color: var(--warn);
      }
      .card-top .del {
        width: 28px;
        height: 28px;
      }
      .card-top .del svg {
        width: 15px;
        height: 15px;
      }

      /* ---------- Undo toast ---------- */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        width: calc(100% - 32px);
        max-width: 388px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 6px 6px 16px;
        background: #2b2b2b;
        color: var(--white);
        border-radius: 8px;
        font-size: 13px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      }
      .toast[hidden] {
        display: none;
      }
      .toast button {
        min-height: 36px;
        padding: 0 12px;
        border: none;
        background: none;
        color: var(--lime);
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- 목업 확인용 전환 막대. 실제 페이지에는 없음 -->
    <div class="preview-bar" role="group" aria-label="Preview">
      <span>Preview</span>
      <button type="button" data-preview="empty">Empty wallet</button>
      <button type="button" data-preview="full">With coupons</button>
    </div>

    <div class="phone">
      <div class="nav">
        <button class="nav-btn" id="langBtn" type="button">
          🌐 <span id="langLabel">한국어</span> ▾
        </button>
        <div class="logo">
          <span class="g">Good</span><span class="l">lugg</span>
        </div>
        <div class="nav-icons">
          <button class="nav-btn" type="button">☰</button>
        </div>
      </div>

      <nav class="mypage-tabs">
        <a href="#" data-i18n="tab.bookings">예약내역</a>
        <a href="#" data-i18n="tab.rewards">포인트</a>
        <a href="#" class="active" data-i18n="tab.coupons">쿠폰함</a>
        <a href="#" data-i18n="tab.referral">친구초대</a>
        <a href="#" data-i18n="tab.profile">회원정보</a>
      </nav>

      <div class="top-area">
        <div class="wallet-head">
          <h1>
            <span data-i18n="wallet.title">내 쿠폰함</span>
            <span class="en" data-i18n="wallet.titleEn">Coupon Wallet</span>
          </h1>
          <p class="sub" data-i18n="wallet.sub">
            쿠폰번호나 할인코드를 여기에 저장해 두세요.
          </p>
        </div>

        <div class="register">
          <label for="codeInput" data-i18n="reg.label"
            >쿠폰번호·할인코드 붙여넣기</label
          >
          <div class="register-row">
            <input
              id="codeInput"
              type="text"
              autocomplete="off"
              spellcheck="false"
              data-i18n-ph="reg.ph"
              placeholder="예: A1B2C3D4E5 또는 WelcomeGoodlugg10"
            />
            <button id="regBtn" type="button" data-i18n="reg.btn">저장</button>
          </div>
          <div id="regMsg"></div>
        </div>
      </div>

      <div class="filters">
        <button type="button" class="active" data-filter="avail">
          <span data-i18n="filter.avail">사용 가능</span>
          <span id="cntAvail">3</span>
        </button>
        <button type="button" data-filter="done">
          <span data-i18n="filter.done">사용완료·만료</span>
          <span id="cntDone">2</span>
        </button>
      </div>

      <div class="list" id="list"></div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <span id="toastMsg"></span>
      <button type="button" id="undoBtn">Undo</button>
    </div>

      function render() {

          return c.state !== "avail";

        /* 정렬: 사용 가능 = 만료 임박순, 사용완료·만료 = 최근순 (날짜가 YYYY.MM.DD 라 문자열 비교로 충분) */
        avail.sort(function (a, b) {
          return a.expire < b.expire ? -1 : a.expire > b.expire ? 1 : 0;
        });
        done.sort(function (a, b) {
          var x = a.used || a.expire;
          var y = b.used || b.expire;
          return x < y ? 1 : x > y ? -1 : 0;
        });
        document.getElementById("cntAvail").textContent = avail.length;
        document.getElementById("cntDone").textContent = done.length;

        var items = filter === "avail" ? avail : done;
        var list = document.getElementById("list");
        list.classList.toggle("is-done", filter !== "avail");

        /* 결제화면이 "쿠폰" / "할인코드" 두 칸으로 나뉘어 있으므로
           쿠폰함도 같은 이름, 같은 순서로 나눠 보여준다. */
        function group(kind, titleKey, whereKey) {
          var rows = items.filter(function (c) {
            return c.kind === kind;

          return (
            '<div class="group">' +
            '<div class="group-head">' +

            "</div>"
          );

        list.innerHTML =

      /* 목업용 조회: 표본 쿠폰(CATALOG)에서 코드를 찾는다. 실제로는 서버 조회.
         빈 쿠폰함(?empty=1)에서 A1B2C3D4E5, WelcomeGoodlugg10 등을 붙여넣으면 카드가 생긴다. */
      document.getElementById("regBtn").addEventListener("click", function () {
        var input = document.getElementById("codeInput");
        var raw = input.value.trim();
        if (!raw) {
          showMsg("err", "err.blank");
          return;
        }
        var v = raw.toUpperCase();

        var exists = DATA.some(function (c) {
          return c.code.toUpperCase() === v;
        });
        if (exists) {
          showMsg("err", "err.dup");
          return;
        }
        var found = null;
        for (var n = 0; n < CATALOG.length; n++) {
          if (CATALOG[n].code.toUpperCase() === v) {
            found = CATALOG[n];
          }
        }
        if (!found) {
          showMsg("err", "err.none");
          return;
        }
        if (found.state === "used") {
          showMsg("err", "err.used");
          return;
        }
        if (found.state === "exp") {
          showMsg("err", "err.exp");
          return;
        }

        var added = JSON.parse(JSON.stringify(found));
        added.source = "wallet";
        DATA.push(added);
        input.value = "";
        showMsg("ok", "ok.added");
        filter = "avail";
        for (var k = 0; k < filterBtns.length; k++) {
          filterBtns[k].classList.remove("active");
        }
        filterBtns[0].classList.add("active");
        render();
        /* 방금 저장한 카드로 스크롤하고 잠깐 강조 */
        var card = document.querySelector('[data-id="' + added.id + '"]');
        if (card) {
          card.classList.add("just-added");
          card.scrollIntoView({ behavior: "smooth", block: "center" });
          setTimeout(function () {
            card.classList.remove("just-added");
          }, 1600);
        }

      /* 목업 확인용: 상단 Preview 막대로 빈 쿠폰함 / 쿠폰 있음 전환. ?empty=1 로 바로 열 수도 있음 */
      var CATALOG = JSON.parse(JSON.stringify(DATA));
      var previewBtns = document.querySelectorAll("[data-preview]");
      function setPreview(mode) {
        DATA =
          mode === "empty"
            ? []
            : CATALOG.map(function (c) {
                return JSON.parse(JSON.stringify(c));
              });
        for (var n = 0; n < previewBtns.length; n++) {
          previewBtns[n].classList.toggle(
            "on",
            previewBtns[n].getAttribute("data-preview") === mode,
          );
        }
        filter = "avail";
        for (var k = 0; k < filterBtns.length; k++) {
          filterBtns[k].classList.toggle("active", k === 0);
        }
        document.getElementById("regMsg").innerHTML = "";
        document.getElementById("toast").hidden = true;
        document.getElementById("codeInput").value = "";
        if (history.replaceState) {
          history.replaceState(
            null,
            "",
            location.pathname + (mode === "empty" ? "?empty=1" : ""),
          );
        }
        render();
      }
      for (var pb = 0; pb < previewBtns.length; pb++) {
        previewBtns[pb].addEventListener("click", function () {
          setPreview(this.getAttribute("data-preview"));
        });
      }
      if (/[?&]empty=1/.test(location.search)) {
        DATA = [];
        previewBtns[0].classList.add("on");
      } else {
        previewBtns[1].classList.add("on");

        .getElementById("codeInput")
        .addEventListener("keydown", function (e) {
