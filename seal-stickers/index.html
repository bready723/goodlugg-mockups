<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goodlugg Seal Stickers: Options</title>
    <link
      rel="stylesheet"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Pretendard", sans-serif;
        background: #f5f4f4;
        color: #252424;
      }

      main {
        max-width: 1600px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px 16px;
        margin-bottom: 16px;
      }

      h1 {
        font-size: 22px;
        font-weight: 700;
        color: #512a72;
      }

      .pdf {
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        background: #512a72;
        padding: 8px 14px;
        border-radius: 6px;
        text-decoration: none;
      }

      .pdf:focus-visible {
        outline: 3px solid #c7c22e;
        outline-offset: 2px;
      }

      figure {
        margin-bottom: 8px;
      }

      figure img {
        display: block;
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Goodlugg Seal Stickers</h1>
        <a class="pdf" href="goodlugg-seal-stickers.pdf"
          >Download print PDF (A3)</a
        >
      </header>
      <figure>
        <img
          src="page-1.png"
          alt="One-line copy L01 to L05"
          width="893"
          height="1246"
        />
      </figure>
      <figure>
        <img
          src="page-2.png"
          alt="One-line copy L06 to L09"
          width="880"
          height="1026"
        />
      </figure>
      <figure>
        <img
          src="page-3.png"
          alt="Stacked copy W01 to W08"
          width="1330"
          height="1080"
        />
      </figure>
      <figure>
        <img
          src="page-4.png"
          alt="Style options S01 to S06"
          width="1330"
          height="844"
        />
      </figure>
      <figure>
        <img
          src="page-5.png"
          alt="Round stickers R01 to R06"
          width="1104"
          height="703"
        />
      </figure>
      <figure>
        <img
          src="page-6.png"
          alt="Sticker box label"
          width="648"
          height="502"
        />
      </figure>
    </main>
  </body>
</html>
