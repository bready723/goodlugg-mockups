<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Hyundai Seoul QR page: current vs across Korea</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Poppins", "Apple SD Gothic Neo", sans-serif;
        background: #e6e6ea;
        color: #121212;
        padding: 24px 16px 48px;
      }

      .grid {
        display: flex;
        gap: 28px;
        justify-content: center;
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .col {
        flex: 0 0 auto;
        width: 430px;
        max-width: 100%;
      }

      .col h2 {
        font-size: 15px;
        font-weight: 700;
        color: #512a72;
        text-align: center;
      }

      .col p {
        margin: 2px 0 12px;
        font-size: 13px;
        color: #555;
        text-align: center;
      }

      .col a {
        color: #512a72;
      }

      iframe {
        display: block;
        width: 100%;
        height: 700px;
        border: 0;
        background: #fff;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.14);
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="col">
        <h2>Current</h2>
        <p>
          Shopping Bag Same-Day Delivery
          (<a href="./" target="_blank" rel="noopener">open</a>)
        </p>
        <iframe src="./index.html" title="Current page"></iframe>
      </div>
      <div class="col">
        <h2>New</h2>
        <p>
          Same-Day Luggage Delivery across Korea
          (<a href="across-korea.html" target="_blank" rel="noopener">open</a>)
        </p>
        <iframe src="across-korea.html" title="New page"></iframe>
      </div>
    </div>
    <script>
      // Size each frame to its page so the two versions line up without inner scrollbars
      document.querySelectorAll("iframe").forEach(function (f) {
        function fit() {
          var d = f.contentDocument;
          if (d && d.querySelector(".page")) {
            f.style.height = d.querySelector(".page").scrollHeight + "px";
          }
        }
        f.addEventListener("load", function () {
          fit();
          setTimeout(fit, 600);
        });
      });
    </script>
  </body>
</html>
