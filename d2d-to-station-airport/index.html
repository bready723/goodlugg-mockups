.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none}
.ov.on{display:block}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:410px;background:#fff;border-radius:18px 18px 0 0;z-index:101;max-height:62vh;display:none;flex-direction:column}
.sheet.on{display:flex}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;font-weight:600;font-size:16px;border-bottom:1px solid #eee}

.slack .who span{font-weight:400;font-size:12px;color:#616061;margin-left:6px}
.slack .who em{font-style:normal;font-size:10px;background:#e8e8e8;color:#555;border-radius:3px;padding:1px 4px;margin-left:4px}

.slack .att div{display:grid;grid-template-columns:118px 1fr}
.slack .att b{color:#616061;font-weight:400}
.slack .ttl{font-size:15px;color:#1d1c1d}
</style>

var PLACES={};STATIONS.concat(AIRPORTS).forEach(function(p){PLACES[p.code]=p;});
var LUG=[['carry','Carry-on','≤ 22"'],['checked','Checked-in','≤ 28"'],['over','Oversize','≤ 32"'],['golf','Golf bag','']];
var PRICE={BUSAN:[12000,16000,20000,20000],PUS:[16000,20000,24000,24000],INTER:[28000,34000,40000,40000]};

function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addDays(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d);}
function dayDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
function toMin(t){var p=t.split(':');return +p[0]*60+ +p[1];}
function fmt(m){return pad(Math.floor(m/60))+':'+pad(m%60);}
function range(a,b,step){var r=[];for(var m=a;m<=b;m+=step)r.push(fmt(m));return r;}
function won(n){return '₩'+n.toLocaleString('en-US');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

var TODAY=iso(new Date());
var S;
function reset(code){
  S={view:'calc',to:code?PLACES[code]:null,toOpen:!code,toMode:code?PLACES[code].kind:'airport',ddOpen:false,
     hdDate:addDays(TODAY,1),hdTime:'',puDate:'',puTime:'',bags:{carry:0,checked:1,over:0,golf:0},
     priced:false,info:false,agreeDep:false,train:'',flightNo:'',flightDt:'',
     cust:{fn:'',ln:'',em:'',ph:''},pay:'card',ag:[false,false,false]};
}
function inCity(){return S.to&&S.to.city===FROM.city;}
function earliest(){
  if(!S.hdTime)return null;
  var hd=toMin(S.hdTime);
  if(inCity())return {date:S.hdDate,start:hd+300};
  return hd<=600?{date:S.hdDate,start:1200}:{date:addDays(S.hdDate,1),start:480};
}
function puSlots(){
  var e=earliest();if(!e||!S.puDate)return [];
  return S.puDate>e.date?range(480,1440,30):range(e.start,1440,30);
}
function syncPickup(){
  var e=earliest();
  if(!e){S.puDate='';S.puTime='';return;}
  if(!S.puDate||S.puDate<e.date)S.puDate=e.date;
  if(puSlots().indexOf(S.puTime)<0)S.puTime='';
  S.priced=false;
}
function ruleText(){
  if(!S.to)return '';
  return inCity()?'Same city: pickup is available from 5 hours after handoff, every 30 minutes until 24:00.'
    :'Different city: handoff by 10:00 for pickup from 20:00 the same day. After 10:00, pickup is from 08:00 the next day.';
}
function bagCount(){return LUG.reduce(function(n,l){return n+S.bags[l[0]];},0);}
function priceTable(){
  if(!S.to)return PRICE.INTER;
  if(S.to.code==='BUSAN')return PRICE.BUSAN;
  if(S.to.code.indexOf('PUS')===0)return PRICE.PUS;
  return inCity()?PRICE.PUS:PRICE.INTER;
}
function storageDays(){var e=earliest();return e&&S.puDate?Math.max(0,dayDiff(e.date,S.puDate)):0;}
function fees(){
  var t=priceTable(),d=0;LUG.forEach(function(l,i){d+=S.bags[l[0]]*t[i];});
  var s=storageDays()*bagCount()*5000;return {delivery:d,storage:s,total:d+s};
}
function ready(){return S.to&&S.hdTime&&S.puDate&&S.puTime&&bagCount()>0;}
function chev(){return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';}

/* ---------- views ---------- */
function header(){return '<div class="langbar">&#127760; English &#8964;</div><div class="hdr"><img src="../d2d-how-to-video/assets/logo_wordmark.png" alt="Goodlugg"><div class="ham"><i></i><i></i><i></i></div></div>';}
function toggle(){
  var m=[['airport','Airport'],['hotel','Hotel'],['stay','Airbnb'],['station','KTX Station'],['cruise','Cruise Terminal'],['other','Other']];
  return '<div class="d2d-place-toggle">'+m.map(function(x){
    var cs=x[0]==='cruise'?' coming-soon':'';
    return '<button class="'+(S.toMode===x[0]?'active':'')+cs+'" data-act="mode" data-v="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</div>';
}
function toWrapper(){
  if(S.toMode==='cruise')return '<div class="d2d-comingsoon-note">Available soon</div>';
  if(S.toMode==='airport'||S.toMode==='station'){
    var list=S.toMode==='airport'?AIRPORTS:STATIONS;
    var h='<div class="dd"><div class="dd-display'+(S.ddOpen?' open':'')+'" data-act="dd">'+(S.toMode==='airport'?'Select an airport':'Select a KTX station')+chev()+'</div>';
    if(S.ddOpen)h+='<div class="dd-list">'+list.map(function(p){return '<div data-act="pick" data-v="'+p.code+'">'+esc(p.name)+'</div>';}).join('')+'</div>';
    return h+'</div>';
  }
  return '<input class="d2d-location-input" placeholder="Search by name or address">';
}
function schedRow(label,dateKey,timeKey,slotsAct,min){
  return '<div class="d2d-calc-schedule-row"><label>'+label+'</label>'
   +'<input type="date" class="d2d-location-input" data-date="'+dateKey+'" value="'+S[dateKey]+'" min="'+min+'">'
   +'<button class="cs-display'+(S[timeKey]?'':' ph')+'" data-act="'+slotsAct+'">'+(S[timeKey]||'Time slot')+chev()+'</button></div>';
}
function lugGrid(){
  return LUG.map(function(l){return '<div class="d2d-luggage-row"><div class="d2d-luggage-info"><span class="d2d-luggage-desc">'+l[1]+'</span>'+(l[2]?'<span class="d2d-luggage-name">'+l[2]+'</span>':'')+'</div>'
   +'<div class="d2d-qty-control"><button class="d2d-qty-btn" data-act="qty" data-v="'+l[0]+',-1">&minus;</button><span class="d2d-qty-value">'+S.bags[l[0]]+'</span><button class="d2d-qty-btn" data-act="qty" data-v="'+l[0]+',1">+</button></div></div>';}).join('');
}
function priceLines(){
  var f=fees(),t=priceTable(),h='';
  LUG.forEach(function(l,i){var q=S.bags[l[0]];if(q)h+='<div class="d2d-price-line"><span>'+l[1]+' &times; '+q+'</span><span class="price">'+won(q*t[i])+'</span></div>';});
  if(f.storage)h+='<div class="d2d-price-line"><span>Storage fee '+bagsTxt(bagCount())+' &times; '+storageDays()+' days</span><span class="price">'+won(f.storage)+'</span></div>';
  return h+'<div class="d2d-price-line total"><span>Total</span><span>'+won(f.total)+'</span></div>';
}
function vCalc(){
  var e=earliest();
  var h=header()+'<div class="d2d-location-section"><h2>Price calculator</h2>';
  h+='<div class="d2d-location-field"><div class="d2d-location-label">&#128205; From</div><div class="d2d-place-row"><span class="d2d-place-row-text"><span class="kicker">'+FROM.type+'</span><span class="value">'+FROM.name+'</span><span class="addr">'+FROM.addr+'</span></span><span class="go">Change</span></div></div>';
  h+='<div class="d2d-location-field"><div class="d2d-location-label">&#128205; To'+(S.toOpen&&S.to?'<button class="d2d-place-close" data-act="closeTo">Close</button>':'')+'</div>';
  if(S.toOpen||!S.to)h+=toggle()+toWrapper();
  else h+='<button class="d2d-place-row" data-act="openTo"><span class="d2d-place-row-text"><span class="kicker">'+S.to.type+'</span><span class="value">'+esc(S.to.name)+'</span><span class="addr">'+esc(S.to.addr||S.to.city)+'</span></span><span class="go">Change</span></button>';
  h+='</div>';
  h+='<div class="d2d-location-field"><div class="d2d-location-label">&#128336; Schedule</div><div class="d2d-calc-schedule'+(S.to?'':' is-locked')+'">'
    +schedRow('Handoff (From)','hdDate','hdTime','hdSlots',TODAY)
    +schedRow('Pickup (To)','puDate','puTime','puSlots',e?e.date:TODAY)+'</div>'
    +(S.to?'<p class="sched-rule">'+ruleText()+'</p>':'')
    +'<p class="sched-note">* The price shown is based on the date and time you select.</p></div>';
  h+='<div class="d2d-location-field"><div class="d2d-location-label">&#128230; Luggage</div><div class="d2d-luggage-grid">'+lugGrid()+'</div>'
    +'<button class="d2d-calc-info-toggle" data-act="info"><span>Size guide &amp; restricted items</span><span>'+(S.info?'Hide':'View')+'</span></button>'
    +(S.info?'<div class="d2d-calc-info-panel"><p>22" = 120cm, 28" = 160cm (length + width + height)</p><p>Items over 32" or 30kg are not accepted.</p><p>First storage day complimentary, ₩5,000/bag/day after.</p></div>':'')+'</div>';
  if(S.priced&&ready())h+='<div class="d2d-price-result">'+priceLines()+'<div class="d2d-ai-pricing-note">&#10022; Live AI pricing: reflects traffic &amp; volume</div><button class="d2d-price-btn d2d-book-with-price-btn" data-act="book">Book with these options</button></div>';
  else h+='<button class="d2d-price-btn" data-act="price"'+(ready()?'':' disabled')+'>Check price</button>';
  return h+'</div>';
}
function prog(n){var h='<div class="d2d-progress">';for(var i=1;i<=5;i++)h+='<i class="'+(i<n?'done':i===n?'active':'')+'"></i>';return h+'</div>';}
function nav(back,next,label,dis){return '<div class="btns"><button class="btn ghost" data-act="go" data-v="'+back+'">Back</button><button class="btn" data-act="go" data-v="'+next+'"'+(dis?' disabled':'')+'>'+(label||'Next')+'</button></div>';}
function meetCard(){
  var p=S.to,d=0.0035;
  var src='https://www.openstreetmap.org/export/embed.html?bbox='+(p.lng-d)+'%2C'+(p.lat-d*0.6)+'%2C'+(p.lng+d)+'%2C'+(p.lat+d*0.6)+'&layer=mapnik&marker='+p.lat+'%2C'+p.lng;
  return '<div class="d2d-place-card"><div class="txt"><div class="name">'+esc(p.meet)+'</div><div class="address">'+esc(p.addr||p.name)+'</div></div><iframe src="'+src+'" loading="lazy" title="Map"></iframe>'
   +(p.photos.length?'<div class="d2d-station-photos">'+p.photos.map(function(u){return '<img src="'+PHOTO+u+'" alt="Meeting place photo">';}).join('')+'</div>':'')+'</div>';
}
function vStep1(){
  return header()+'<div class="bk">'+prog(1)+'<h1>Departure</h1><p class="sub">Where do we collect your luggage?</p>'
   +'<div class="selected-location"><div class="k">'+FROM.type+'</div><div class="n">'+FROM.name+'</div><div class="a">'+FROM.addr+'</div></div>'
   +'<div class="d2d-warn-box"><b>Hotel handoff</b>Leave your luggage with the hotel front desk before your handoff time. Our driver collects it from the front desk.</div>'
   +'<label class="d2d-agree"><input type="checkbox" data-chk="agreeDep"'+(S.agreeDep?' checked':'')+'><span>I confirm this hotel has a staffed front desk that can keep my luggage.</span></label>'
   +nav('calc','s2','Next',!S.agreeDep)+'</div>';
}
function vStep2(){
  var p=S.to,st=p.kind==='station',h=header()+'<div class="bk">'+prog(2)+'<h1>Destination</h1><p class="sub">Where do you receive your luggage?</p>'
   +'<div class="selected-location"><div class="k">'+p.type+'</div><div class="n">'+esc(p.name)+'</div></div>'
   +'<label class="d2d-label">'+(p.desk?'Goodlugg desk':'Meeting place')+'</label>'+meetCard();
  if(!p.desk)h+='<div class="d2d-warn-box"><b>Meet-up rules</b>Our driver meets you at this spot at your pickup time and hands over your luggage in person. Please be there on time.</div>';
  if(st)h+='<div class="d2d-field"><label class="d2d-label">Train departure time <span class="opt">(optional)</span></label><input type="time" class="d2d-input" data-in="train" value="'+S.train+'"></div>';
  else h+='<div class="d2d-field"><label class="d2d-label">Departure flight no. <span class="req">*</span></label><input class="d2d-input" data-in="flightNo" placeholder="e.g. KE1104" value="'+esc(S.flightNo)+'"></div>'
    +'<div class="d2d-field"><label class="d2d-label">Departure date / time <span class="req">*</span></label><input type="datetime-local" class="d2d-input" data-in="flightDt" value="'+S.flightDt+'"></div>';
  return h+nav('s1','s3')+'</div>';
}
function vStep3(){
  var e=earliest();
  return header()+'<div class="bk">'+prog(3)+'<h1>Schedule &amp; Luggage</h1><p class="sub">When will you drop off and pick up?</p>'
   +'<h3>Drop-off at your departure</h3><div class="two"><div class="d2d-field"><label class="d2d-label">Date <span class="req">*</span></label><input type="date" class="d2d-input" data-date="hdDate" value="'+S.hdDate+'" min="'+TODAY+'"></div>'
   +'<div class="d2d-field"><label class="d2d-label">Time slot <span class="req">*</span></label><button class="cs-display'+(S.hdTime?'':' ph')+'" data-act="hdSlots">'+(S.hdTime||'Please select')+chev()+'</button></div></div>'
   +'<h3>Pickup at your destination</h3><div class="two"><div class="d2d-field"><label class="d2d-label">Date <span class="req">*</span></label><input type="date" class="d2d-input" data-date="puDate" value="'+S.puDate+'" min="'+(e?e.date:TODAY)+'"></div>'
   +'<div class="d2d-field"><label class="d2d-label">Time slot <span class="req">*</span></label><button class="cs-display'+(S.puTime?'':' ph')+'" data-act="puSlots">'+(S.puTime||'Please select')+chev()+'</button></div></div>'
   +'<p class="sched-rule" style="margin-top:-4px">'+ruleText()+'</p>'
   +'<h3>Luggage</h3>'+LUG.map(function(l){return '<div class="lug-row"><div class="d2d-luggage-info"><span class="d2d-luggage-desc">'+l[1]+'</span>'+(l[2]?'<span class="d2d-luggage-name">'+l[2]+'</span>':'')+'</div><div class="d2d-qty-control"><button class="d2d-qty-btn" data-act="qty" data-v="'+l[0]+',-1">&minus;</button><span class="d2d-qty-value">'+S.bags[l[0]]+'</span><button class="d2d-qty-btn" data-act="qty" data-v="'+l[0]+',1">+</button></div></div>';}).join('')
   +nav('s2','s4','Next',!ready())+'</div>';
}
function vStep4(){
  var c=S.cust;
  return header()+'<div class="bk">'+prog(4)+'<h1>Customer Info</h1><p class="sub">Who is travelling?</p>'
   +'<div class="two"><div class="d2d-field"><label class="d2d-label">First name <span class="req">*</span></label><input class="d2d-input" data-cu="fn" value="'+esc(c.fn)+'" placeholder="As in passport"></div>'
   +'<div class="d2d-field"><label class="d2d-label">Last name <span class="req">*</span></label><input class="d2d-input" data-cu="ln" value="'+esc(c.ln)+'"></div></div>'
   +'<div class="d2d-field"><label class="d2d-label">Email <span class="req">*</span></label><input class="d2d-input" data-cu="em" value="'+esc(c.em)+'" placeholder="name@example.com"></div>'
   +'<div class="d2d-field"><label class="d2d-label">Phone <span class="req">*</span></label><div class="two" style="grid-template-columns:110px 1fr"><button class="cs-display">+1'+chev()+'</button><input class="d2d-input" data-cu="ph" value="'+esc(c.ph)+'"></div></div>'
   +nav('s3','s5')+'</div>';
}
function vStep5(){
  var p=S.to,f=fees(),st=p.kind==='station';
  var extra=st?(S.train?'<div class="sum-row"><span>Train (Departure)</span><span>'+S.train+'</span></div>':'')
    :'<div class="sum-row"><span>Flight (Departure)</span><span>'+esc(S.flightNo||'KE1104')+(S.flightDt?' / '+S.flightDt.replace('T',' '):'')+'</span></div>';
  var ags=['I agree to the Terms of Service.','I agree to the Privacy Policy.','I agree to the cancellation and refund policy.'];
  return header()+'<div class="bk">'+prog(5)+'<h1>Review &amp; Payment</h1><p class="sub">Please review your booking!</p><h3 style="font-size:18px;margin-top:0">Booking summary</h3>'
   +'<div class="sum-h">Delivery info</div>'
   +'<div class="sum-card dep"><div class="sum-row"><span>Departure</span><span>'+FROM.name+'</span></div><div class="sum-row"><span>Departure Address</span><span>'+FROM.addr+'</span></div><div class="sum-row"><span>Handoff method</span><span>Hotel front desk</span></div></div>'
   +'<div class="sum-card arr"><div class="sum-row"><span>Destination</span><span>'+esc(p.name)+'</span></div><div class="sum-row"><span>'+(p.desk?'Goodlugg desk':'Meeting place')+'</span><span>'+esc(p.meet)+'</span></div>'+extra+'</div>'
   +'<div class="sum-h">Schedule</div><div class="plain"><div class="sum-row"><span>Drop-off date/time</span><span>'+S.hdDate+' '+S.hdTime+'</span></div><div class="sum-row"><span>Pick-up date/time</span><span>'+S.puDate+' '+S.puTime+'</span></div></div>'
   +'<div class="sum-h">Luggage</div><div class="plain">'+LUG.filter(function(l){return S.bags[l[0]];}).map(function(l){return '<div class="sum-row"><span>'+l[1]+'</span><span>'+bagsTxt(S.bags[l[0]])+'</span></div>';}).join('')+'</div>'
   +'<div class="sum-h">Payment method</div>'
   +['card,International card','paypal,PayPal'].map(function(x){var a=x.split(',');return '<label class="d2d-pay-opt'+(S.pay===a[0]?' on':'')+'"><input type="radio" name="pay" data-pay="'+a[0]+'"'+(S.pay===a[0]?' checked':'')+'>'+a[1]+'</label>';}).join('')
   +ags.map(function(t,i){return '<label class="d2d-agree"><input type="checkbox" data-ag="'+i+'"'+(S.ag[i]?' checked':'')+'><span>'+t+' <span style="color:#FF5607">*</span></span></label>';}).join('')
   +'<div class="pricebox"><div class="ttl">Estimated Price</div><div class="d2d-price-line"><span>Delivery fee</span><span>'+won(f.delivery)+'</span></div>'
   +(f.storage?'<div class="d2d-price-line"><span>Storage fee '+bagsTxt(bagCount())+' &times; '+storageDays()+' days</span><span>'+won(f.storage)+'</span></div>':'')
   +'<div class="d2d-price-line total"><span>Payment amount</span><span class="amt">'+won(f.total)+'</span></div></div>'
   +nav('s4','done','Pay '+won(f.total),!(S.ag[0]&&S.ag[1]&&S.ag[2]))+'</div>';
}
function vDone(){
  var p=S.to;
  return header()+'<div class="bk"><div class="fin"><div class="ck"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></div><h1>Booking confirmed</h1><div class="no">Booking no. GL-2026-11-4827</div></div>'
   +'<div class="meetbig"><div class="k">'+(p.desk?'Pick up your luggage at':'Meet our driver at')+'</div><div class="t">'+S.puDate+' '+S.puTime+'</div><div class="p">'+esc(p.name)+'</div><div>'+esc(p.meet)+'</div></div>'
   +meetCard()
   +'<div class="plain"><div class="sum-row"><span>Handoff</span><span>'+S.hdDate+' '+S.hdTime+', '+FROM.name+'</span></div><div class="sum-row"><span>Luggage</span><span>'+bagsTxt(bagCount())+'</span></div><div class="sum-row"><span>Paid</span><span>'+won(fees().total)+'</span></div></div>'
   +'<div class="btns"><button class="btn" data-act="go" data-v="done">Track my luggage</button></div></div>';
}
function row(k,v){return '<div><b>'+k+'</b><span>'+v+'</span></div>';}
function bagsTxt(n){return n+(n===1?' bag':' bags');}
function vSlack(){
  if(!S.to)S.to=PLACES.BUSAN;
  if(!S.hdTime){S.hdTime='11:00';syncPickup();}
  if(!S.puTime)S.puTime=puSlots()[0];
  var p=S.to,lug=LUG.filter(function(l){return S.bags[l[0]];}).map(function(l){return l[1]+' '+S.bags[l[0]];}).join(', ');
  return '<div class="slack"><div class="ch"># d2d-booking-alert</div><div class="msg"><div class="av">G</div><div><div class="who">Goodlugg Booking<em>APP</em><span>just now</span></div>'
   +'<div class="ttl">&#128276; New D2D booking: To '+p.type+'</div><div class="att">'
   +row('Booking no.','GL-2026-11-4827')+row('Route',FROM.name+' &rarr; '+esc(p.name)+' ('+(inCity()?'in-city':'inter-city')+')')
   +row('Delivery','Direct')+row('Handoff',S.hdDate+' '+S.hdTime+', hotel front desk')
   +row('Meetup',S.puDate+' '+S.puTime)+row('Meeting place',esc(p.meet))+row('Luggage',lug)+row('Paid',won(fees().total))+'</div></div></div></div>';
}
var VIEWS={calc:vCalc,s1:vStep1,s2:vStep2,s3:vStep3,s4:vStep4,s5:vStep5,done:vDone,slack:vSlack};
function render(scroll){
  var el=document.getElementById('app');
  el.innerHTML=S.view==='slack'?vSlack():'<div class="phone">'+VIEWS[S.view]()+'</div>';
  if(scroll)window.scrollTo(0,0);
}

/* ---------- bottom sheet ---------- */
function openSheet(title,groups,cb){
  document.getElementById('sheet-t').textContent=title;
  var b=document.getElementById('sheet-b');b.innerHTML='';
  groups.forEach(function(g){
    if(g.label){var l=document.createElement('div');l.className='grp';l.textContent=g.label;b.appendChild(l);}
    g.items.forEach(function(t){var d=document.createElement('div');d.className='it';d.textContent=t;d.onclick=function(){closeSheet();cb(t);};b.appendChild(d);});
  });
  document.getElementById('ov').classList.add('on');document.getElementById('sheet').classList.add('on');
}
function closeSheet(){document.getElementById('ov').classList.remove('on');document.getElementById('sheet').classList.remove('on');}
document.getElementById('ov').onclick=closeSheet;document.getElementById('sheet-x').onclick=closeSheet;

/* ---------- events ---------- */
var ACT={
  mode:function(v){S.toMode=v;S.ddOpen=false;},
  dd:function(){S.ddOpen=!S.ddOpen;},
  pick:function(v){S.to=PLACES[v];S.toOpen=false;S.ddOpen=false;S.puDate='';syncPickup();},
  openTo:function(){S.toOpen=true;S.toMode=S.to.kind;},
  closeTo:function(){S.toOpen=false;},
  info:function(){S.info=!S.info;},
  qty:function(v){var a=v.split(',');S.bags[a[0]]=Math.max(0,S.bags[a[0]]+ +a[1]);S.priced=false;},
  price:function(){S.priced=true;},
  book:function(){S.view='s1';return true;},
  go:function(v){S.view=v;return true;},
  hdSlots:function(){
    openSheet('Please select',[{items:range(480,1080,60)}],function(t){S.hdTime=t;S.puDate='';syncPickup();render();});return 'skip';
  },
  puSlots:function(){
    if(!S.hdTime){ACT.hdSlots();return 'skip';}
    var e=earliest(),same=S.puDate===S.hdDate;
    openSheet('Please select',[{label:S.puDate+(same?' (same day)':S.puDate===e.date?' (next day)':''),items:puSlots()}],function(t){S.puTime=t;S.priced=false;render();});return 'skip';
  }
};
document.getElementById('app').addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(!t)return;
  var r=ACT[t.dataset.act](t.dataset.v);
  if(r==='skip')return;render(r===true);
});
document.getElementById('app').addEventListener('change',function(ev){
  var t=ev.target,d=t.dataset;
  if(d.date){S[d.date]=t.value;if(d.date==='hdDate')S.puDate='';syncPickup();render();}
  else if(d.chk){S[d.chk]=t.checked;render();}
  else if(d.ag){S.ag[+d.ag]=t.checked;render();}
  else if(d.pay){S.pay=d.pay;render();}
});
document.getElementById('app').addEventListener('input',function(ev){
  var d=ev.target.dataset;
  if(d.in)S[d.in]=ev.target.value;else if(d.cu)S.cust[d.cu]=ev.target.value;
});
document.getElementById('pv').addEventListener('click',function(ev){
  var b=ev.target.closest('button');if(!b)return;
  [].forEach.call(this.querySelectorAll('button'),function(x){x.classList.toggle('on',x===b);});
  if(b.dataset.s==='SLACK'){S.view='slack';}else reset(b.dataset.s);
  render(true);
});
reset(null);render();
</script>
</body>
</html>
