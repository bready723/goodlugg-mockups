.dd-display{width:100%;border:1px solid #ddd;border-radius:8px;padding:12px 14px;font-size:14px;background:#fff;display:flex;justify-content:space-between;align-items:center;cursor:pointer;color:#999}

.cs-display.ph{color:#999}
.sched-note{font-size:12px;margin:6px 0 0;color:#121212;line-height:1.4}

.d2d-luggage-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid #eee;border-radius:12px;background:#fff;overflow:hidden;margin-top:2px}

.d2d-luggage-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.d2d-luggage-desc{font-size:13px;font-weight:700;color:#000;line-height:1.25;overflow-wrap:anywhere;margin-bottom:2px}
.d2d-luggage-name{font-size:11px;color:#777}
.d2d-qty-control{display:flex;align-items:center;gap:4px;flex:none}

.d2d-price-line{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}
.d2d-price-line.total{border-top:1px solid #ddd;margin-top:8px;padding-top:12px;font-weight:700;font-size:16px}

.d2d-book-with-price-btn{background:#BBE22F;color:#333}
.d2d-ai-pricing-note{margin-top:12px;font-size:12px;color:#512772;font-weight:700}

/* booking: live d2d/booking.css */
.d2d-progress{display:flex;gap:4px;padding:20px 20px 0}
.d2d-progress i{flex:1;height:4px;border-radius:2px;background:#e8e8e8}
.d2d-progress i.done{background:#BBE22F}
.d2d-progress i.active{background:#512772}
.d2d-step-title{font-size:22px;font-weight:700;color:#222;padding:16px 20px 0;margin:0;line-height:1.5}
.d2d-step-subtitle{font-size:13px;color:#888;padding:4px 20px 16px;margin:0}
.bk{padding:0 20px}
.bk h3{font-size:15px;font-weight:600;margin:18px 0 10px;color:#222}
.d2d-field{margin-bottom:16px}
.d2d-label{font-size:14px;font-weight:600;margin-bottom:6px;display:block}
.d2d-label .req{color:#FF5607;margin-left:4px}
.d2d-label .opt{color:#999;font-weight:400}
.d2d-input{width:100%;border:1px solid #ddd;border-radius:10px;padding:12px 14px;font-size:14px;outline:none;background:#fff;color:#333}
.d2d-input::placeholder{color:#aaa}
.d2d-input:focus{border-color:#512772}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.selected-location{border:2px solid #667eea;background:#f8f9fa;border-radius:12px;padding:16px;margin-bottom:20px}
.selected-location .lab{font-size:12px;font-weight:600;color:#667eea;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}
.selected-location .body{display:flex;gap:10px;align-items:flex-start}
.selected-location .pin{font-size:18px;line-height:1.4}
.selected-location .t{flex:1;min-width:0}
.selected-location .n{font-weight:600;font-size:16px;line-height:1.3}
.selected-location .a{font-size:13px;color:#666;margin:4px 0 0 31px;line-height:1.3}
.selected-location .chg{flex:none;border:0;background:#667eea;color:#fff;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;cursor:pointer}
.selected-location .view{display:inline-block;border:1px solid #667eea;background:#fff;color:#667eea;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;margin:8px 0 0 31px}
.d2d-place-card{background:#f5f0fa;border-radius:12px;overflow:hidden;margin:10px 0 16px}
.d2d-place-card .txt{padding:14px 14px 12px}
.d2d-place-card .name{font-weight:600;font-size:14px}
.d2d-place-card .address{font-size:12px;color:#666;margin-top:2px}
.d2d-place-card iframe{display:block;width:100%;height:180px;border:0}
.d2d-place-card .sub{font-size:13px;font-weight:600;color:#512772;padding:10px 14px 8px}
.d2d-station-photos{display:flex;gap:8px;overflow-x:auto;padding:0 14px 14px}
.d2d-station-photos img{width:100%;border-radius:8px;display:block}
.d2d-meet-rules{background:#FFF8F0;border:1px solid #FFD4A8;color:#B86800;border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:16px;line-height:1.6}
.d2d-meet-rules b{display:block}
.d2d-agree{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:10px 0;cursor:pointer;line-height:1.45}
.d2d-agree input{margin-top:3px;accent-color:#512772;flex:none;width:16px;height:16px}
.lug-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.lug-row .d2d-qty-btn{width:32px;height:32px;font-size:18px}
.lug-row .d2d-qty-control{gap:12px}
.lug-row .d2d-luggage-desc{font-size:14px;margin:0}
.lug-row .d2d-luggage-name{font-size:12px;color:#999}
.d2d-luggage-note{margin:8px 0 0;font-size:12px;line-height:1.4;color:#121212}
.btns{display:flex;gap:10px;margin-top:28px}
.d2d-btn{flex:1;height:50px;border-radius:12px;border:none;background:#512772;color:#fff;font-size:15px;font-weight:600;cursor:pointer}

.sum-h{color:#512772;font-weight:600;font-size:14px;margin:16px 2px 8px}
.sum-card{border-radius:10px;padding:10px 14px;margin-bottom:8px}

.plain .sum-row{padding:5px 2px}
.d2d-pay-opt{display:flex;align-items:center;gap:10px;border:1px solid #ddd;border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}

.d2d-price-container{position:sticky;bottom:0;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.08);padding:8px 20px 18px;z-index:20}
.d2d-price-container .chev{display:flex;justify-content:center;padding:6px 0 8px}

.d2d-price-container .d2d-price-line{font-size:13px}

.meetbig .p{font-weight:600;margin-top:6px}

/* bottom sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none}
.ov.on{display:block}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;background:#fff;border-radius:20px 20px 0 0;z-index:101;max-height:62vh;display:none;flex-direction:column}
.sheet.on{display:flex}

/* slack */
.slack{max-width:560px;margin:16px auto;background:#fff;border-radius:10px;border:1px solid #ddd;overflow:hidden;font-family:Lato,'Helvetica Neue',Arial,sans-serif}

.slack .who span{font-weight:400;font-size:12px;color:#616061;margin-left:6px}
.slack .who em{font-style:normal;font-size:10px;background:#e8e8e8;color:#555;border-radius:3px;padding:1px 4px;margin-left:4px}
.slack .ttl{font-size:15px;color:#1d1c1d}
.slack .att{border-left:4px solid #512772;padding:2px 0 2px 12px;margin-top:6px;font-size:14px;line-height:1.6;color:#1d1c1d}
.slack .att div{display:grid;grid-template-columns:104px 1fr;gap:6px}
.slack .att b{color:#616061;font-weight:400}
</style>
</head>

function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addDays(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d);}
function dayDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
function toMin(t){var p=t.split(':');return +p[0]*60+ +p[1];}
function fmt(m){return pad(Math.floor(m/60))+':'+pad(m%60);}
function range(a,b,step){var r=[];for(var m=a;m<=b;m+=step)r.push(fmt(m));return r;}
function won(n){return '₩'+n.toLocaleString('en-US');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

var TODAY=iso(new Date());

function reset(code){

     priced:false,info:false,agreeDep:false,train:'',flightNo:'',flightDt:'',
     cust:{fn:'',ln:'',em:'',ph:''},pay:'card',ag:[false,false,false]};
}
function inCity(){return S.to&&S.to.city===FROM.city;}
function earliest(){
  if(!S.hdTime)return null;
  var hd=toMin(S.hdTime);
  if(inCity())return {date:S.hdDate,start:hd+300};
  return hd<=600?{date:S.hdDate,start:1200}:{date:addDays(S.hdDate,1),start:480};
}
function puSlots(){
  var e=earliest();if(!e||!S.puDate)return [];
  return S.puDate>e.date?range(480,1440,30):range(e.start,1440,30);
}
function syncPickup(){
  var e=earliest();
  if(!e){S.puDate='';S.puTime='';return;}
  if(!S.puDate||S.puDate<e.date)S.puDate=e.date;
  if(puSlots().indexOf(S.puTime)<0)S.puTime='';
  S.priced=false;
}
function ruleText(){
  if(!S.to)return '';
  return inCity()?'Same city: pickup is available from 5 hours after handoff, every 30 minutes until 24:00.'
    :'Different city: handoff by 10:00 for pickup from 20:00 the same day. After 10:00, pickup is from 08:00 the next day.';
}
function bagCount(){return LUG.reduce(function(n,l){return n+S.bags[l[0]];},0);}
function priceTable(){
  if(!S.to)return PRICE.INTER;
  if(S.to.code==='BUSAN')return PRICE.BUSAN;

function storageDays(){var e=earliest();return e&&S.puDate?Math.max(0,dayDiff(e.date,S.puDate)):0;}

   +(storageDays()?'<div class="sum-row"><span>Storage days</span><span>'+storageDays()+' days</span></div>':'')+'</div>'
   +(nm||c.em||c.ph?'<div class="sum-h">Customer info</div><div class="plain">'+(nm?'<div class="sum-row"><span>Name</span><span>'+esc(nm)+'</span></div>':'')+(c.em?'<div class="sum-row"><span>Email</span><span>'+esc(c.em)+'</span></div>':'')+(c.ph?'<div class="sum-row"><span>Phone</span><span>+1 '+esc(c.ph)+'</span></div>':'')+'</div>':'')
   +'<div class="sum-h">Payment method</div>'
   +['card,International card','paypal,PayPal'].map(function(x){var a=x.split(',');return '<label class="d2d-pay-opt'+(S.pay===a[0]?' on':'')+'"><input type="radio" name="pay" data-pay="'+a[0]+'"'+(S.pay===a[0]?' checked':'')+'>'+a[1]+'</label>';}).join('')
   +'<label class="d2d-agree" style="font-weight:600;margin-top:16px"><input type="checkbox" data-agall="1"'+(all?' checked':'')+'><span>Agree to all</span></label>'
   +ags.map(function(t,i){return '<label class="d2d-agree"><input type="checkbox" data-ag="'+i+'"'+(S.ag[i]?' checked':'')+'><span>'+t+'<span style="color:#FF5607"> *</span></span></label>';}).join('')
   +nav('s4','done','Pay '+won(f.total),!all)+'</div></div>'+drawer(true);
}
function vDone(){
  var p=S.to;
  return '<div class="grow">'+header()+'<div class="bk"><div class="fin"><div class="ck"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></div><h1>Booking confirmed</h1><div class="no">Booking no. GL-2026-11-4827</div></div>'
   +'<div class="meetbig"><div class="k">'+(p.desk?'Pick up your luggage at':'Meet our driver at')+'</div><div class="t">'+S.puDate+' '+S.puTime+'</div><div class="p">'+esc(p.name)+'</div><div>'+esc(p.desk?'Goodlugg desk (1F)':p.meet)+'</div></div>'
   +(p.desk?'':meetCard())
   +'<div class="plain"><div class="sum-row"><span>Handoff</span><span>'+S.hdDate+' '+S.hdTime+', '+FROM.name+'</span></div><div class="sum-row"><span>Luggage</span><span>'+bagsTxt(bagCount())+'</span></div><div class="sum-row"><span>Paid</span><span>'+won(fees().total)+'</span></div></div>'
   +'<div class="btns"><button class="d2d-btn" data-act="noop">Track my luggage</button></div></div></div>';
}
function row(k,v){return '<div><b>'+k+'</b><span>'+v+'</span></div>';}
function bagsTxt(n){return n+(n===1?' bag':' bags');}
function vSlack(){
  if(!S.to)S.to=PLACES.BUSAN;
  if(!bagCount())S.bags.checked=1;
  if(!S.hdTime){S.hdTime='11:00';syncPickup();}
  if(!S.puTime)S.puTime=puSlots()[0];
  var p=S.to,lug=LUG.filter(function(l){return S.bags[l[0]];}).map(function(l){return l[1]+' '+S.bags[l[0]];}).join(', ');
  return '<div class="slack"><div class="ch"># d2d-booking-alert</div><div class="msg"><div class="av">G</div><div><div class="who">Goodlugg Booking<em>APP</em><span>just now</span></div>'
   +'<div class="ttl">&#128276; New D2D booking: To '+p.type+'</div><div class="att">'
   +row('Booking no.','GL-2026-11-4827')+row('Route',FROM.name+' &rarr; '+esc(p.name)+' ('+(inCity()?'in-city':'inter-city')+')')
   +row('Delivery','Direct')+row('Handoff',S.hdDate+' '+S.hdTime+', hotel front desk')
   +row('Meetup',S.puDate+' '+S.puTime)+row('Meet location',esc(p.desk?'Goodlugg desk (1F)':p.meet))+row('Luggage',lug)+row('Paid',won(fees().total))+'</div></div></div></div>';
}
var VIEWS={calc:vCalc,s1:vStep1,s2:vStep2,s3:vStep3,s4:vStep4,s5:vStep5,done:vDone,slack:vSlack};
function render(scroll){
  var el=document.getElementById('app');
  el.innerHTML=S.view==='slack'?vSlack():'<div class="phone">'+VIEWS[S.view]()+'</div>';
  if(scroll)window.scrollTo(0,0);
}

/* ---------- bottom sheet ---------- */
function openSheet(title,groups,cb){
  document.getElementById('sheet-t').textContent=title;
  var b=document.getElementById('sheet-b');b.innerHTML='';
  groups.forEach(function(g){
    if(g.label){var l=document.createElement('div');l.className='grp';l.textContent=g.label;b.appendChild(l);}
    g.items.forEach(function(t){var d=document.createElement('div');d.className='it';d.textContent=t;d.onclick=function(){closeSheet();cb(t);};b.appendChild(d);});
  });
  document.getElementById('ov').classList.add('on');document.getElementById('sheet').classList.add('on');
}
function closeSheet(){document.getElementById('ov').classList.remove('on');document.getElementById('sheet').classList.remove('on');}
document.getElementById('ov').onclick=closeSheet;document.getElementById('sheet-x').onclick=closeSheet;

/* ---------- events ---------- */
var ACT={
  mode:function(v){S.toMode=v;S.ddOpen=false;},
  dd:function(){S.ddOpen=!S.ddOpen;},
  pick:function(v){S.to=PLACES[v];S.toOpen=false;S.ddOpen=false;S.puDate='';syncPickup();},
  openTo:function(){S.toOpen=true;S.toMode=S.to.kind;},
  closeTo:function(){S.toOpen=false;},
  info:function(){S.info=!S.info;},
  qty:function(v){var a=v.split(',');S.bags[a[0]]=Math.max(0,S.bags[a[0]]+ +a[1]);S.priced=false;},
  noop:function(){return 'skip';},
  drawer:function(v){S.drawer=v==='1';},
  toCalc:function(){S.view='calc';S.toOpen=true;S.toMode=S.to.kind;return true;},
  book:function(){S.view='s1';S.drawer=null;return true;},
  go:function(v){S.view=v;S.drawer=null;return true;},
  hdSlots:function(){
    openSheet('Please select',[{items:range(480,1080,60)}],function(t){S.hdTime=t;S.puDate='';S.puTime='';syncPickup();render();});return 'skip';
  },
  puSlots:function(){
    if(!S.hdTime){ACT.hdSlots();return 'skip';}
    var e=earliest(),same=S.puDate===S.hdDate;
    openSheet('Please select',[{label:S.puDate+(same?' (same day)':S.puDate===e.date?' (next day)':''),items:puSlots()}],function(t){S.puTime=t;S.priced=false;render();});return 'skip';
  }
};
document.getElementById('app').addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(!t)return;
  var r=ACT[t.dataset.act](t.dataset.v);
  if(r==='skip')return;render(r===true);
});
document.getElementById('app').addEventListener('change',function(ev){
  var t=ev.target,d=t.dataset;
  if(d.date){S[d.date]=t.value;if(d.date==='hdDate'){S.puDate='';S.puTime='';}if(d.date==='hdDate'||d.date==='puDate')syncPickup();render();}
  else if(d.agall){S.ag=[t.checked,t.checked,t.checked];render();}
  else if(d.chk){S[d.chk]=t.checked;render();}
  else if(d.ag){S.ag[+d.ag]=t.checked;render();}
  else if(d.pay){S.pay=d.pay;render();}
});
document.getElementById('app').addEventListener('input',function(ev){
  var d=ev.target.dataset;
  if(d.in){S[d.in]=ev.target.value;var nb=document.querySelector('.d2d-btn-next');if(nb&&S.view==='s2')nb.disabled=!(S.flightNo&&S.flightDt);}
  else if(d.cu)S.cust[d.cu]=ev.target.value;
});
document.getElementById('app').addEventListener('click',function(ev){
  var i=ev.target.closest('.datef input');if(i&&i.showPicker){try{i.showPicker();}catch(e){}}
});
document.getElementById('pv').addEventListener('click',function(ev){
  var b=ev.target.closest('button');if(!b)return;
  [].forEach.call(this.querySelectorAll('button'),function(x){x.classList.toggle('on',x===b);});
  if(b.dataset.s==='SLACK'){S.view='slack';}else reset(b.dataset.s);
  render(true);
});
reset(null);render();
</script>
</body>
</html>
