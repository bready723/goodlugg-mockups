<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICN BF Visa POP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f3f6; color: #252424; font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  header { padding: 28px 16px 8px; text-align: center; }
  h1 { margin: 0; font-size: 24px; color: #512a72; }
  .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px; max-width: 2200px; margin: 12px auto 40px; padding: 0 16px; }
  @media (max-width: 1400px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 8px rgba(0,0,0,.08); padding: 16px; text-align: center; }
  .card h2 { font-size: 16px; margin: 0 0 4px; color: #512a72; }
  .badge { display: inline-block; background: #c7c22e; color: #512a72; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
  .card img { width: 100%; height: auto; border: 1px solid #e3e0e8; border-radius: 6px; display: block; }
  .links { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .links a { text-decoration: none; background: #512a72; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; }
  .links a.ghost { background: #fff; color: #512a72; border: 1px solid #512a72; }
  h2.sec { max-width: 1100px; margin: 8px auto 0; padding: 0 16px; font-size: 15px; color: #512a72; }
</style>
</head>
<body>
<header>
  <h1>ICN BF Visa POP</h1>
</header>
<div class="grid">
  <div class="card">
    <h2>Current POP (photo)</h2>
    <img src="original_photo.jpg" alt="Current POP (photo)">
    
  </div>
  <div class="card">
    <h2>A. White background<span class="badge">Recommended</span></h2>
    <img src="preview_a.png" alt="A. White background">
    <div class="links"><a href="pop_a.html">Open</a><a class="ghost" href="pop_a.pdf">PDF</a></div>
  </div>
  <div class="card">
    <h2>B. Visa blue background</h2>
    <img src="preview_b.png" alt="B. Visa blue background">
    <div class="links"><a href="pop_b.html">Open</a><a class="ghost" href="pop_b.pdf">PDF</a></div>
  </div>
  <div class="card">
    <h2>C. White, one-line hero, QR below</h2>
    <img src="preview_c.png" alt="C. White, one-line hero, QR below">
    <div class="links"><a href="pop_c.html">Open</a><a class="ghost" href="pop_c.pdf">PDF</a></div>
  </div>
  <div class="card">
    <h2>C2. C with the PRM line in the lime chip</h2>
    <img src="preview_c2.png" alt="C2. C with the PRM line in the lime chip">
    <div class="links"><a href="pop_c2.html">Open</a><a class="ghost" href="pop_c2.pdf">PDF</a></div>
  </div>
</div>
</body>
</html>
