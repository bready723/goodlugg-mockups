<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Goodlugg × Visa — Hotel card & POP</title>
<style>
  :root{--ink:#1a1420;--ink-3:#6a5d74;--line:#e7e1ec;--bg:#f2efe9;--purple:#512a72}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:400 15px/1.5 'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  header{padding:40px 24px 24px;max-width:1180px;margin:0 auto}
  h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em}
  .sub{margin:6px 0 0;color:var(--ink-3);font:500 12px/1.4 ui-monospace,Menlo,monospace}
  main{max-width:1180px;margin:0 auto;padding:0 24px 60px}
  h2{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
     color:var(--ink-3);margin:34px 0 16px;padding-bottom:9px;border-bottom:1px solid var(--line)}
  .grid{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
  figure{margin:0}
  figure img{display:block;width:100%;height:auto;border-radius:3px;
             box-shadow:0 1px 2px rgba(0,0,0,.14),0 12px 26px -10px rgba(0,0,0,.3)}
  .card figure{width:210px}
  .board{width:270px}
  .tray{width:180px}
  figcaption{margin-top:10px;font:500 11px/1.4 ui-monospace,Menlo,monospace;color:var(--ink-3)}
  figcaption a{color:var(--purple)}
  @media(max-width:620px){.card figure,.board,.tray{width:100%}}
</style></head><body>
<header>
  <h1>Goodlugg &times; Visa &mdash; Hotel card &amp; POP</h1>
  <p class="sub">54 &times; 86 mm card &middot; 148 &times; 210 mm board &middot; 54 &times; 46 mm tray</p>
</header>
<main>
  <h2>Name card</h2>
  <div class="grid card">
    <figure><img src="trim/front_A_trim.png" alt="Front A"><figcaption>front A &middot; <a href="print/front_A.png">print</a></figcaption></figure>
    <figure><img src="trim/front_A3_trim.png" alt="Front A3"><figcaption>front A3 &middot; <a href="print/front_A3.png">print</a></figcaption></figure>
    <figure><img src="trim/front_A2_trim.png" alt="Front A2"><figcaption>front A2 &middot; <a href="print/front_A2.png">print</a></figcaption></figure>
    <figure><img src="trim/back_trim.png" alt="Back"><figcaption>back &middot; <a href="print/back.png">print</a></figcaption></figure>
  </div>
  <h2>POP</h2>
  <div class="grid">
    <figure class="board"><img src="trim/pop_assembled_trim.png" alt="POP assembled"><figcaption>assembled</figcaption></figure>
    <figure class="board"><img src="trim/pop_trim.png" alt="POP board"><figcaption>board &middot; <a href="print/pop.png">print</a></figcaption></figure>
    <figure class="tray"><img src="trim/pop_tray_trim.png" alt="Tray front"><figcaption>tray &middot; <a href="print/pop_tray.png">print</a></figcaption></figure>
  </div>
</main>
</body></html>
