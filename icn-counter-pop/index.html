<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICN Counter POP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f3f6; color: #252424; font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  header { padding: 28px 16px 8px; text-align: center; }
  h1 { margin: 0; font-size: 24px; color: #512a72; }
  .sub { margin: 6px 0 0; font-size: 14px; color: #666; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; max-width: 1100px; margin: 16px auto 48px; padding: 0 16px; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 8px rgba(0,0,0,.08); padding: 16px; text-align: center; }
  .card h2 { font-size: 16px; margin: 0 0 4px; color: #512a72; }
  .badge { display: inline-block; background: #c7c22e; color: #512a72; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
  .card p { margin: 0 0 12px; font-size: 13px; color: #666; }
  .card img { width: 100%; height: auto; border: 1px solid #e3e0e8; border-radius: 6px; display: block; }
  .links { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .links a { text-decoration: none; background: #512a72; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; }
  .links a.ghost { background: #fff; color: #512a72; border: 1px solid #512a72; }
</style>
</head>
<body>
<header>
  <h1>ICN Counter POP</h1>
  <p class="sub">A4 portrait, one sheet on the Incheon Airport T1 counter</p>
</header>
<div class="grid">
  <div class="card">
    <h2>A. White<span class="badge">Recommended</span></h2>
    <p>Purple text on white: reads clearly in an inspection photo</p>
    <a href="pop_a.html"><img src="preview_a.png" alt="POP variant A preview"></a>
    <div class="links"><a href="pop_a.html">Open</a><a class="ghost" href="pop_a.pdf">PDF</a></div>
  </div>
  <div class="card">
    <h2>B. Purple</h2>
    <p>Brand purple background, white text</p>
    <a href="pop_b.html"><img src="preview_b.png" alt="POP variant B preview"></a>
    <div class="links"><a href="pop_b.html">Open</a><a class="ghost" href="pop_b.pdf">PDF</a></div>
  </div>
</div>
</body>
</html>
