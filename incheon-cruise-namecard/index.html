<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Incheon Cruise Name Card</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--purple:#512a72;--ink:#1d1d1f;--muted:#6b6b74;--bg:#f3f3f5}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:Pretendard,-apple-system,sans-serif;color:var(--ink)}
.wrap{max-width:1040px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:22px;margin:0 0 24px;color:var(--purple)}
.ver{background:#fff;border-radius:10px;padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:28px}
.ver h2{font-size:17px;margin:0 0 14px;color:var(--purple)}
.cards{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;margin-bottom:16px}
.frame{width:240px;height:400px;overflow:hidden;border:1px solid #ddd;border-radius:4px;position:relative;background:#fff}
.frame iframe{position:absolute;left:0;top:0;width:66mm;height:106mm;border:0;transform-origin:0 0}
.dl{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-block;background:var(--purple);color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:10px 16px;border-radius:6px}
.btn.alt{background:#fff;color:var(--purple);border:1.5px solid var(--purple)}
@media (max-width:640px){.frame{width:200px;height:333px}}
</style></head>
<body><div class="wrap">
<h1>Incheon Cruise Name Card</h1>
<div class="ver"><h2>A. Today's Special Price</h2>
<div class="cards">
  <div class="frame"><iframe src="front_A.html" title="front A"></iframe></div>
  <div class="frame"><iframe src="back_A.html" title="back A"></iframe></div>
  <a href="preview_A.png" target="_blank"><img src="preview_A.png" alt="preview A" style="width:300px;display:block;border-radius:4px"></a>
</div>
<div class="dl">
  <a class="btn" href="IncheonCruise_NameCard_A_20261016.pdf" download>Print PDF</a>
  <a class="btn alt" href="IncheonCruise_NameCard_A_20261016_A4.pdf" download>A4 sheet</a>
  <a class="btn alt" href="preview_A.png" download>Preview PNG</a>
</div></div>
<div class="ver"><h2>B. Today-Only Price</h2>
<div class="cards">
  <div class="frame"><iframe src="front_B.html" title="front B"></iframe></div>
  <div class="frame"><iframe src="back_B.html" title="back B"></iframe></div>
  <a href="preview_B.png" target="_blank"><img src="preview_B.png" alt="preview B" style="width:300px;display:block;border-radius:4px"></a>
</div>
<div class="dl">
  <a class="btn" href="IncheonCruise_NameCard_B_20261016.pdf" download>Print PDF</a>
  <a class="btn alt" href="IncheonCruise_NameCard_B_20261016_A4.pdf" download>A4 sheet</a>
  <a class="btn alt" href="preview_B.png" download>Preview PNG</a>
</div></div>
<div class="ver"><h2>C. Cruise Guest Special Price</h2>
<div class="cards">
  <div class="frame"><iframe src="front_C.html" title="front C"></iframe></div>
  <div class="frame"><iframe src="back_C.html" title="back C"></iframe></div>
  <a href="preview_C.png" target="_blank"><img src="preview_C.png" alt="preview C" style="width:300px;display:block;border-radius:4px"></a>
</div>
<div class="dl">
  <a class="btn" href="IncheonCruise_NameCard_C_20261016.pdf" download>Print PDF</a>
  <a class="btn alt" href="IncheonCruise_NameCard_C_20261016_A4.pdf" download>A4 sheet</a>
  <a class="btn alt" href="preview_C.png" download>Preview PNG</a>
</div></div>
</div>
<script>
document.querySelectorAll('.frame').forEach(fr=>{const ifr=fr.querySelector('iframe');const mm=96/25.4;const s=fr.clientWidth/(66*mm);ifr.style.transform=`scale(${s})`;});
</script>
</body></html>
