<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Incheon Cruise name card: back</title><link rel="stylesheet" href="card.css"></head>
<body>
<div class="page back">
  <div class="b h1 long">Special Offer Details</div>
  <div class="b sec1">
    <div class="h2">Delivery available to</div>
    <div class="li">Incheon / Gimpo Airport</div>
    <div class="li">Hotels in Seoul / Gyeonggi area</div>
    <div class="li note">*One order, one delivery address</div>
  </div>
  <div class="b sec2">
    <div class="h2">Delivery Time</div>
    <div class="tbl">
      <div class="r"><span>To Incheon / Gimpo Airport</span><b>by 4 pm</b></div>
      <div class="r"><span>To Seoul / Incheon area</span><b>by 6 pm</b></div>
      <div class="r"><span>To other Gyeonggi areas</span><b>by 8 pm</b></div>
    </div>
  </div>
  <div class="b other">Other destinations across Korea?</div>
  <img class="cruise-qr" src="assets/qr_cruise.png" alt="Book QR">
  <div class="b book">Book in 5 min.</div>
</div>
</body></html>
