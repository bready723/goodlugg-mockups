<meta charset="utf-8">
<title>호텔 알림 이메일 — 카드 3형식 비교</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --ground:#e9edf3; --surface:#ffffff; --ink:#1b2430; --muted:#5a6473; --hair:#dde2e9;
    --accent:#5b2ea6; --accent-soft:#efe7fb; --accent-ink:#5b2aa6;
    --good:#0f8a53; --good-soft:#e0f2e9;
    --warn:#a96a12; --warn-soft:#f6ecd6;
    --bad:#bf3a2b;
    /* Goodlugg email frame — constant across themes (real emails render on white) */
    --paper:#ffffff; --paper-ink:#26292e; --paper-sub:#5a6068; --paper-hair:#e6e9ee;
    --paper-muted:#9a9ea6; --paper-link:#2a4bd0;
    --gl-purple:#43206b; --gl-good:#3a1d6e; --gl-lugg:#9aa32e;
    --gl-border:#d7cce6; --gl-box:#f4f1f8; --gl-boxline:#e5ddf0;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 10px 30px rgba(16,24,40,.09);
    --ui:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    --email:Arial, "Helvetica Neue", Helvetica, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --ground:#0f141b; --surface:#161c25; --ink:#e7ebf1; --muted:#98a3b3; --hair:#29323f;
      --accent:#b294f0; --accent-soft:#241a38; --accent-ink:#c9b3f5;
      --good:#43d18c; --good-soft:#16281f; --warn:#e0a63e; --warn-soft:#2b2312; --bad:#f0796a;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="light"]{
    --ground:#e9edf3; --surface:#ffffff; --ink:#1b2430; --muted:#5a6473; --hair:#dde2e9;
    --accent:#5b2ea6; --accent-soft:#efe7fb; --accent-ink:#5b2aa6;
    --good:#0f8a53; --good-soft:#e0f2e9; --warn:#a96a12; --warn-soft:#f6ecd6; --bad:#bf3a2b;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 10px 30px rgba(16,24,40,.09);
  }
  :root[data-theme="dark"]{
    --ground:#0f141b; --surface:#161c25; --ink:#e7ebf1; --muted:#98a3b3; --hair:#29323f;
    --accent:#b294f0; --accent-soft:#241a38; --accent-ink:#c9b3f5;
    --good:#43d18c; --good-soft:#16281f; --warn:#e0a63e; --warn-soft:#2b2312; --bad:#f0796a;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  .wrap{max-width:1180px;margin:0 auto;padding:40px 22px 72px;}

  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent-ink);}
  h1{font-size:clamp(26px,4vw,38px);line-height:1.12;letter-spacing:-.02em;margin:.35em 0 .3em;font-weight:800;text-wrap:balance;}
  .lede{font-size:17px;color:var(--muted);max-width:66ch;margin:0;}
  .meta{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;}
  .tag{font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--hair);border-radius:999px;padding:5px 11px;}

  .rec{margin:30px 0 8px;background:var(--surface);border:1px solid var(--hair);border-left:4px solid var(--good);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);display:flex;gap:16px;align-items:flex-start;}
  .rec .badge{flex:none;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--good);border-radius:8px;padding:6px 10px;margin-top:2px;}
  .rec h2{margin:0 0 4px;font-size:18px;letter-spacing:-.01em;}
  .rec p{margin:0;color:var(--muted);font-size:14.5px;}
  .rec b{color:var(--ink);}

  h2.sec{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:44px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--hair);}

  .tablewrap{overflow-x:auto;border:1px solid var(--hair);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);}
  table{border-collapse:collapse;width:100%;min-width:660px;font-size:14px;}
  th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--hair);vertical-align:top;}
  thead th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:color-mix(in srgb,var(--surface) 100%, var(--ink) 3%);font-weight:700;}
  tbody tr:last-child td{border-bottom:none;}
  td.v{font-weight:700;color:var(--ink);white-space:nowrap;}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;line-height:1.4;}
  .pill.g{color:var(--good);background:var(--good-soft);}
  .pill.w{color:var(--warn);background:var(--warn-soft);}
  .pill.n{color:var(--muted);background:color-mix(in srgb,var(--surface) 100%, var(--ink) 6%);}
  .star{color:var(--good);font-weight:800;}

  .variants{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:22px;margin-top:6px;align-items:start;}
  .variant{background:var(--surface);border:1px solid var(--hair);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;}
  .variant.pick{border-color:var(--good);}
  .vhead{padding:15px 17px 14px;border-bottom:1px solid var(--hair);}
  .vlabel{font-size:15px;font-weight:800;letter-spacing:-.01em;}
  .vorigin{font-size:11px;font-weight:700;margin-left:7px;padding:2px 7px;border-radius:999px;vertical-align:middle;}
  .vorigin.o{color:var(--muted);background:color-mix(in srgb,var(--surface) 100%, var(--ink) 7%);}
  .vorigin.p{color:var(--accent-ink);background:var(--accent-soft);}
  .vsub{margin:7px 0 0;font-size:13px;color:var(--muted);}
  .vprint{margin-top:11px;display:flex;gap:8px;flex-wrap:wrap;}
  .vsubject{font-size:11.5px;color:var(--muted);padding:11px 17px 0;line-height:1.45;}
  .vsubject b{color:var(--ink);font-weight:700;}

  .stage{padding:18px;background:color-mix(in srgb,var(--ground) 60%, var(--surface) 40%);flex:1;display:flex;justify-content:center;}

  /* ===== Goodlugg email frame ===== */
  .mail{width:100%;max-width:600px;background:var(--paper);color:var(--paper-ink);border:1px solid var(--gl-border);font-family:var(--email);box-shadow:0 2px 10px rgba(16,24,40,.10);overflow:hidden;}
  .mhead{padding:26px 20px 22px;text-align:center;border-bottom:1px solid #efeaf5;}
  .wm{font-size:30px;font-weight:800;letter-spacing:-.5px;}
  .wm .wg{color:var(--gl-good);}
  .wm .wl{color:var(--gl-lugg);}
  .mbanner{background:var(--gl-purple);color:#fff;text-align:center;font-size:13px;font-weight:700;letter-spacing:.01em;padding:11px 14px;}
  .mbody{padding:22px 26px 8px;font-size:13.5px;color:var(--paper-ink);}
  .mbody p{margin:0 0 14px;}
  .mbody b{color:var(--paper-ink);font-weight:700;}
  .mbody a{color:var(--paper-link);text-decoration:underline;}
  .mbody ul{margin:0 0 22px;padding-left:20px;}
  .mbody li{margin:0 0 1px;line-height:1.4;}
  .mbody .dethead{color:var(--paper-ink);margin:22px 0 2px;}
  .mbody .ask-h{margin:0 0 3px;font-size:15px;}
  .mbody .ask{margin:0 0 18px;}          /* gap after the [See message card] line */
  .mbody .cardimg{margin:2px 0 20px;text-align:center;}
  .mbody .cardimg img{display:inline-block;height:auto;border:1px solid var(--paper-hair);border-radius:6px;}
  .mbody .sign{margin-top:18px;}
  .mfoot{border-top:1px solid #ececf0;padding:16px 26px 22px;color:var(--paper-muted);font-size:11px;line-height:1.7;}

  .single{display:flex;justify-content:center;}
  .single .variant{width:100%;max-width:378px;}

  .notes{margin-top:14px;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);}
  .notes h3{margin:0 0 12px;font-size:14px;letter-spacing:.02em;}
  .notes ul{margin:0;padding-left:18px;}
  .notes li{margin:0 0 9px;color:var(--muted);font-size:14px;}
  .notes li b{color:var(--ink);}
  .flag{border-left:3px solid var(--warn);background:var(--warn-soft);padding:11px 14px;border-radius:0 8px 8px 0;color:var(--ink);margin:0 0 9px;font-size:14px;}
  .flag b{color:var(--warn);}
  footer{margin-top:34px;color:var(--muted);font-size:12.5px;text-align:center;}
</style>

<div class="wrap">
  <h1 style="margin:0 0 6px;font-size:clamp(24px,3.4vw,34px);font-weight:800;letter-spacing:-.02em;">Goodlugg 호텔 알림 이메일 포맷</h1>
  <p style="margin:0 0 10px;color:var(--muted);font-size:15px;font-weight:600;">PICKUP 카드 3형식 (A 링크만 / B 전체이미지 / C 썸네일) + DELIVERY · 예약정보 불릿 정리</p>

      <tbody>

        <tr><td class="v">B · 전체 이미지</td><td>상인님 원본</td><td>가장 강함 — 크게 보임</td><td><span class="pill w">⚠ 2페이지 위험</span></td><td><span class="pill n">비추천</span></td></tr>
        <tr><td class="v">C · 썸네일 + 링크</td><td>제안</td><td>좋음 — 작아도 인식</td><td><span class="pill g">✓ 1페이지</span></td><td><span class="star">★ 추천</span></td></tr>
      </tbody>
    </table>
  </div>
